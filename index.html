<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">

    <!-- React & ReactDOM CDN -->

    <style>
        body {
            background-color: #050507;
            color: #F4F4F6;
            overflow-x: hidden;
        }
        /* Custom Black & Gold Glossy Luxury Effects */
        .bg-glossy-dark {
            background: radial-gradient(circle at top right, rgba(234, 179, 8, 0.08), transparent 55%),
                        linear-gradient(145deg, rgba(20, 18, 12, 0.96) 0%, rgba(7, 7, 10, 0.99) 100%);
            backdrop-filter: blur(16px);
        }
        .border-glossy {
            border: 1px solid rgba(234, 179, 8, 0.32);
            box-shadow: inset 0 1px 0 0 rgba(254, 240, 138, 0.25), 0 12px 35px -10px rgba(0, 0, 0, 0.92), 0 0 25px -8px rgba(234, 179, 8, 0.15);
        }
        .matte-crimson {
            background: linear-gradient(135deg, #FFFBEB 0%, #FDE047 35%, #D4AF37 70%, #854D0E 100%);
            border: 1px solid rgba(254, 249, 195, 0.75);
            color: #050507 !important;
            box-shadow: 0 0 22px rgba(234, 179, 8, 0.4), inset 0 1px 2px rgba(255, 255, 255, 0.8);
        }
        .glossy-white-accent {
            background: linear-gradient(180deg, #FFFBEB 0%, #FDE047 38%, #CA8A04 82%, #713F12 100%);
            color: #050507 !important;
            border: 1px solid rgba(254, 249, 195, 0.8);
            box-shadow: 0 0 25px rgba(234, 179, 8, 0.45), inset 0 1px 2px rgba(255, 255, 255, 0.85);

                        linear-gradient(145deg, #12100B 0%, #060608 100%);

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

            background: #08080A;
        }

            border-radius: 9999px;

            background: #EAB308;
        }

            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .animate-pulse-fast {
            animation: pulse-fast 1.2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="min-h-screen antialiased selection:bg-amber-500 selection:text-black">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // Komponen Logo 3D Metallic Golden Scorpion dengan Bingkai Cincin Ganda (Persis Gambar Terlampir)
        const GoldenScorpionLogo = ({ size = 56 }) => (
            <svg
                width={size}
                height={size}

                        <stop offset="0%" stopColor="#FFFBEB" />
                        <stop offset="18%" stopColor="#FDE047" />
                        <stop offset="40%" stopColor="#D4AF37" />
                        <stop offset="62%" stopColor="#854D0E" />
                        <stop offset="82%" stopColor="#FACC15" />
                        <stop offset="100%" stopColor="#713F12" />

                        <stop offset="35%" stopColor="#CA8A04" />
                        <stop offset="70%" stopColor="#713F12" />
                        <stop offset="100%" stopColor="#FDE047" />
                    </linearGradient>

                    {/* Gradasi Tubuh 3D Metallic Gold Scorpion */}
                    <linearGradient id="scorpionGold3D" x1="15%" y1="10%" x2="85%" y2="90%">
                        <stop offset="0%" stopColor="#FFFFFF" />
                        <stop offset="18%" stopColor="#FEF08A" />

                        <stop offset="75%" stopColor="#A16207" />

                    </linearGradient>

                    {/* Gradasi Highlight Segmen Punggung & Capit */}
                    <radialGradient id="goldSpecular" cx="35%" cy="30%" r="65%">
                        <stop offset="0%" stopColor="#FFFFFF" />
                        <stop offset="28%" stopColor="#FEF08A" />
                        <stop offset="65%" stopColor="#CA8A04" />
                        <stop offset="100%" stopColor="#5C3409" />
                    </radialGradient>

                    {/* Gradasi Bayangan Bawah Capit & Kaki */}
                    <linearGradient id="darkGoldShade" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stopColor="#EAB308" />
                        <stop offset="55%" stopColor="#854D0E" />
                        <stop offset="100%" stopColor="#3B1D06" />
                    </linearGradient>

                    {/* Bayangan Lantai Halus di Bawah Kalajengking */}
                    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stopColor="rgba(0,0,0,0.65)" />
                        <stop offset="65%" stopColor="rgba(0,0,0,0.25)" />

                    </radialGradient>
                </defs>

                {/* Latar Belakang Putih/Terang Bersih di Dalam Lingkaran (Sesuai Gambar Asli) */}
                <circle cx="100" cy="100" r="93" fill="#FFFFFF" />

                {/* Bayangan Halus di Bawah Kaki & Capit Kalajengking */}
                <ellipse cx="98" cy="142" rx="58" ry="14" fill="url(#floorShadow)" />

                {/* CINCIN EMAS LUAR (Tebal & Berkilau 3D) */}
                <circle
                    cx="100"
                    cy="100"
                    r="91"
                    fill="none"
                    stroke="url(#outerGoldRing)"
                    strokeWidth="9.5"
                />
                <circle
                    cx="100"
                    cy="100"
                    r="95.5"
                    fill="none"
                    stroke="#713F12"
                    strokeWidth="0.8"
                    opacity="0.7"

                {/* CINCIN EMAS DALAM (Konsentris Berjarak Persis Gambar) */}
                <circle
                    cx="100"
                    cy="100"
                    r="77.5"
                    fill="none"
                    stroke="url(#innerGoldRing)"
                    strokeWidth="4.2"
                />

                {/* ==================== KAKI-KAKI BELAKANG KIRI (DI ATAS/BELAKANG BADAN) ==================== */}
                <g stroke="#5C3409" strokeWidth="0.8" strokeLinejoin="round">
                    {/* Kaki Kiri 1 */}
                    <path d="M84 108 L75 98 L65 113 L61 117 L66 118 L75 104 L84 111 Z" fill="url(#darkGoldShade)" />
                    {/* Kaki Kiri 2 */}
                    <path d="M95 103 L87 91 L76 107 L72 111 L77 112 L87 97 L95 106 Z" fill="url(#darkGoldShade)" />
                    {/* Kaki Kiri 3 */}
                    <path d="M107 98 L99 87 L89 102 L86 106 L91 106 L99 93 L107 101 Z" fill="url(#darkGoldShade)" />
                </g>

                {/* ==================== CAPIT KANAN BELAKANG (MENJULUR KE KIRI BAWAH) ==================== */}
                <g stroke="#5C3409" strokeWidth="1" strokeLinejoin="round">
                    {/* Lengan Capit Kiri */}
                    <path
                        d="M84 116 C75 109, 66 106, 59 111 C55 114, 59 121, 67 121 C73 121, 79 121, 84 119 Z"
                        fill="url(#goldSpecular)"
                    />
                    {/* Kepala Capit Kiri Mengarah ke Kiri Bawah */}
                    <path
                        d="M61 111 C49 109, 40 116, 36 128 C34 134, 34 139, 36 140 C39 138, 43 131, 47 127 C51 124, 57 123, 62 119 Z"
                        fill="url(#goldSpecular)"
                    />
                    {/* Jepitan Bawah Capit Kiri */}
                    <path
                        d="M58 119 C50 123, 44 129, 41 136 C45 134, 52 128, 60 122 Z"
                        fill="url(#darkGoldShade)"
                    />
                </g>

                {/* ==================== EKOR BERUAS MELENGKUNG TINGGI DI KANAN ATAS (5 RUAS + SENGAT) ==================== */}
                <g stroke="#5C3409" strokeWidth="1.1" strokeLinejoin="round">
                    {/* Ruas Ekor 1 (Pangkal Bawah) */}
                    <path
                        d="M132 103 C143 102, 152 94, 151 84 C149 77, 139 78, 134 85 C130 91, 129 98, 132 103 Z"
                        fill="url(#goldSpecular)"
                    />
                    {/* Ruas Ekor 2 (Naik) */}
                    <path
                        d="M140 84 C152 83, 159 73, 156 63 C153 56, 142 58, 139 66 C136 73, 137 80, 140 84 Z"
                        fill="url(#goldSpecular)"
                    />
                    {/* Ruas Ekor 3 (Melengkung Atas) */}
                    <path
                        d="M143 64 C154 60, 158 49, 151 41 C145 35, 135 40, 136 49 C136 56, 139 61, 143 64 Z"
                        fill="url(#goldSpecular)"
                    />
                    {/* Ruas Ekor 4 (Puncak Lengkungan) */}
                    <path
                        d="M142 44 C147 36, 141 28, 130 31 C122 33, 118 41, 122 47 C127 51, 136 49, 142 44 Z"
                        fill="url(#goldSpecular)"
                    />
                    {/* Kantung Sengat (Telson Bulat Berkilau) */}
                    <path
                        d="M124 41 C116 42, 112 51, 117 59 C121 65, 130 65, 132 58 C134 52, 130 43, 124 41 Z"
                        fill="url(#goldSpecular)"
                    />
                    {/* Jarum Sengat Tajam Melengkung ke Bawah */}
                    <path
                        d="M128 60 C132 65, 133 72, 129 78 C128 73, 127 67, 123 62 Z"
                        fill="url(#darkGoldShade)"
                    />
                </g>

                {/* ==================== BADAN BERUAS 3D (MENGHADAP SERONG KIRI DEPAN) ==================== */}
                <g stroke="#5C3409" strokeWidth="1.1" strokeLinejoin="round">
                    {/* Segmen Pangkal Ekor */}
                    <path
                        d="M122 95 C132 92, 142 99, 141 108 C139 115, 129 117, 120 112 Z"
                        fill="url(#goldSpecular)"
                    />
                    {/* Segmen Perut 5 */}
                    <path
                        d="M114 97 C125 93, 136 101, 135 112 C133 119, 122 121, 112 115 Z"
                        fill="url(#goldSpecular)"
                    />
                    {/* Segmen Perut 4 */}
                    <path
                        d="M106 100 C118 96, 130 105, 128 116 C125 123, 114 125, 104 118 Z"
                        fill="url(#goldSpecular)"
                    />
                    {/* Segmen Perut 3 */}
                    <path
                        d="M98 104 C110 99, 123 108, 121 120 C118 127, 106 129, 96 122 Z"
                        fill="url(#goldSpecular)"
                    />
                    {/* Segmen Perut 2 */}
                    <path
                        d="M90 108 C102 103, 115 112, 113 124 C110 131, 98 133, 88 126 Z"
                        fill="url(#goldSpecular)"
                    />
                    {/* Kepala / Cephalothorax (Bagian Depan Lebar Berkilau) */}
                    <path
                        d="M78 116 C86 107, 102 108, 106 119 C109 128, 97 136, 84 133 C76 131, 74 122, 78 116 Z"
                        fill="url(#goldSpecular)"
                    />
                    {/* Detail Mata & Lekukan Kepala */}
                    <ellipse cx="88" cy="117" rx="3.5" ry="2" transform="rotate(-18 88 117)" fill="#713F12" opacity="0.65" />
                </g>

                {/* ==================== KAKI-KAKI KANAN DEPAN (4 PASANG KAKI BERUAS REALISTIS) ==================== */}
                <g stroke="#5C3409" strokeWidth="1" strokeLinejoin="round">
                    {/* Kaki Kanan 1 (Depan) */}
                    <path d="M102 128 L115 123 L123 139 L121 148 L125 149 L127 138 L117 119 L101 124 Z" fill="url(#scorpionGold3D)" />
                    {/* Kaki Kanan 2 */}
                    <path d="M111 124 L128 118 L139 135 L142 145 L147 146 L143 133 L130 114 L110 120 Z" fill="url(#scorpionGold3D)" />
                    {/* Kaki Kanan 3 */}
                    <path d="M120 119 L139 112 L153 129 L158 139 L164 139 L157 126 L141 107 L119 115 Z" fill="url(#scorpionGold3D)" />
                </g>

                {/* ==================== CAPIT DEPAN BESAR (MENonjol 3D DI TENGAH DEPAN) ==================== */}
                <g stroke="#451A03" strokeWidth="1.2" strokeLinejoin="round">
                    {/* Bahu & Lengan Capit Depan */}
                    <path
                        d="M94 128 C102 128, 111 133, 112 141 C112 148, 104 152, 97 148 C92 145, 91 135, 94 128 Z"
                        fill="url(#goldSpecular)"
                    />
                    {/* Capit Utama Besar Mengarah ke Kiri Bawah */}
                    <path
                        d="M106 138 C100 132, 88 134, 78 142 C72 146, 65 148, 66 150 C68 152, 76 151, 83 149 C78 154, 70 158, 69 161 C71 163, 81 160, 90 155 C101 150, 109 145, 106 138 Z"
                        fill="url(#goldSpecular)"
                    />
                    {/* Highlight Kilau Putih Emas pada Capit & Punggung */}
                    <path
                        d="M84 143 C90 139, 97 138, 101 141"
                        stroke="#FFFBEB"
                        strokeWidth="2.2"
                        strokeLinecap="round"
                        opacity="0.85"
                    />
                    <path
                        d="M93 114 C103 108, 116 102, 128 97"
                        stroke="#FFFBEB"
                        strokeWidth="2"
                        strokeLinecap="round"
                        opacity="0.7"
                    />
                </g>
            </svg>
        );

        // Komponen Helper untuk Ikon Lucide agar selalu sinkron dengan React
        const Icon = ({ name, size = 18, className = "" }) => {
            const spanRef = useRef(null);
            useEffect(() => {
                if (spanRef.current && window.lucide) {
                    spanRef.current.innerHTML = `<i data-lucide="${name}"></i>`;
                    window.lucide.createIcons({
                        root: spanRef.current,
                        attrs: {
                            width: size,
                            height: size,
                            class: className
                        }
                    });
                }
            }, [name, size, className]);
            return <span ref={spanRef} className="inline-flex items-center justify-center shrink-0" />;
        };

        // Komponen Tooltip Penjelas untuk Pengguna Awam
        const InfoTooltip = ({ text }) => {
            return (
                <div className="relative group inline-flex items-center ml-1.5 cursor-help align-middle">
                    <span className="w-4 h-4 rounded-full bg-zinc-900 border border-amber-500/50 text-amber-300 flex items-center justify-center text-[10px] font-bold group-hover:bg-amber-400 group-hover:border-amber-200 group-hover:text-black transition-colors">
                        ?
                    </span>
                    <div className="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 hidden group-hover:block w-64 p-2.5 bg-zinc-950/95 text-zinc-100 text-xs leading-relaxed rounded-xl border border-amber-500/40 shadow-2xl z-50 pointer-events-none backdrop-blur-md">
                        {text}
                        <div className="absolute top-full left-1/2 -translate-x-1/2 border-4 border-transparent border-t-amber-500/40"></div>
                    </div>
                </div>
            );
        };

        // Format Mata Uang Rupiah
        const formatIDR = (number) => {
            const prefix = number < 0 ? "-Rp " : "Rp ";
            return prefix + Math.abs(Math.round(number)).toLocaleString('id-ID');
        };

        // Deskripsi Detail Strategi
        const STRATEGIES = {
            anti_sideway: {
                id: 'anti_sideway',
                name: 'Metode 1: Anti-Sideway (Ping-Pong)',
                shortName: 'Anti-Sideway',
                badge: 'Cocok Pasar Zig-Zag',
                desc: 'Bot akan mengambil posisi BERLAWANAN arah jika transaksi sebelumnya PROFIT (WIN), atau mempertahankan arah kompensasi ketika pasar bergerak bolak-balik (Ping-Pong). Sangat ampuh di market yang tidak memiliki tren jelas.',
            },
            follow_trend: {
                id: 'follow_trend',
                name: 'Metode 2: Trend Panjang (Follow Trend)',
                shortName: 'Follow Trend',
                badge: 'Cocok Pasar Bullish/Bearish Kuat',
                desc: 'Bot selalu membuka posisi MENGIKUTI warna candle terakhir yang baru saja tertutup. Jika candle terakhir Hijau (Naik), maka bot otomatis OP NAIK (CALL). Jika Merah (Turun), bot otomatis OP TURUN (PUT).',
            },
            reversal_5: {
                id: 'reversal_5',
                name: 'Metode 3: Reversal 5 Candle (Sniper)',
                shortName: 'Reversal 5 Candle',
                badge: 'Akurasi Tinggi / Sabar',
                desc: 'Bot memantau pergerakan chart secara pasif dan HANYA akan mengeksekusi OP secara otomatis berbalik arah (Lawan Tren) tepat setelah mendeteksi 5 candle beruntun dengan warna yang sama.',
            }
        };

        const App = () => {
            // ================= STATE UTAMA BOT =================
            const [botStatus, setBotStatus] = useState('STANDBY'); // 'STANDBY' | 'RUNNING' | 'PAUSED'
            const [toastMsg, setToastMsg] = useState(null);

            // ================= STATE PANEL KIRI: STRATEGI & KEUANGAN =================
            const [selectedMethod, setSelectedMethod] = useState('anti_sideway');
            const [baseAmount, setBaseAmount] = useState(14000);
            const [payoutRate, setPayoutRate] = useState(85); // Persentase profit broker (default 85%)
            const [martingaleEnabled, setMartingaleEnabled] = useState(true);
            const [martingaleMultiplier, setMartingaleMultiplier] = useState(2.0);
            const [maxMartingaleStep, setMaxMartingaleStep] = useState(3);
            const [takeProfit, setTakeProfit] = useState(150000);
            const [stopLoss, setStopLoss] = useState(100000);

            // ================= STATE PANEL TENGAH: TIMING & SIMULATOR =================
            const [secondsLeft, setSecondsLeft] = useState(60);
            const [autoSimOnZero, setAutoSimOnZero] = useState(false);
            const [candleHistory, setCandleHistory] = useState([]);
            
            // State Eksekusi & Perhitungan Martingale
            const [currentStep, setCurrentStep] = useState(0);
            const [pingPongSignal, setPingPongSignal] = useState('UP'); // Default arah awal Metode 1
            const [cumulativeProfit, setCumulativeProfit] = useState(0);
            const [initialBalance, setInitialBalance] = useState(1000000); // Modal Awal Akun (Rp)
            const [liveBrokerBalance, setLiveBrokerBalance] = useState(null); // Saldo terbaca langsung dari DOM Broker
            const [lastBalanceSync, setLastBalanceSync] = useState(null);
            const [accountType, setAccountType] = useState('REAL'); // 'REAL' | 'DEMO'

            // State Zero-Delay Auto-Shot Engine (Presisi Milidetik Awal Menit)
            const [msLeft, setMsLeft] = useState(0);
            const [zeroDelayShot, setZeroDelayShot] = useState(true);
            const [preShotLeadMs, setPreShotLeadMs] = useState(150); // Eksekusi 150ms sebelum detik 00.000 untuk kompensasi ping
            const [shotCount, setShotCount] = useState(0);
            const lastFiredMinuteRef = useRef(null);

            // ================= STATE PANEL KANAN: BRIDGE & SELECTOR =================
            const [brokerPreset, setBrokerPreset] = useState('stockity');
            const [callSelector, setCallSelector] = useState('.deal-buttons__button_up, .btn-call, [data-test="deal-button-up"], button.bg-green, .vui-button--green');
            const [putSelector, setPutSelector] = useState('.deal-buttons__button_down, .btn-put, [data-test="deal-button-down"], button.bg-red, .vui-button--red');
            const [amountSelector, setAmountSelector] = useState('input[name="amount"], .amount-input input');
            const [balanceSelector, setBalanceSelector] = useState('.header__balance-amount, .balance_current, [data-test="balance-amount"], .account-balance__amount');
            const [activeRightTab, setActiveRightTab] = useState('script'); // 'script' | 'guide' | 'config'
            const [copiedScript, setCopiedScript] = useState(false);

            // ================= STATE FOOTER: LOG AKTIVITAS =================
            const [tradeLogs, setTradeLogs] = useState([]);

            // Helper Notifikasi Toast (Tanpa alert browser)
            const showNotification = (title, message, type = 'info') => {
                setToastMsg({ title, message, type });
                setTimeout(() => {
                    setToastMsg((prev) => (prev?.title === title ? null : prev));
                }, 4000);
            };

            // ================= LOGIKA PRESET BROKER =================
            const handleBrokerPresetChange = (preset) => {
                setBrokerPreset(preset);
                if (preset === 'stockity') {
                    setCallSelector('.deal-buttons__button_up, .btn-call, [data-test="deal-button-up"]');
                    setPutSelector('.deal-buttons__button_down, .btn-put, [data-test="deal-button-down"]');
                    setBalanceSelector('.header__balance-amount, .balance_current, [data-test="balance-amount"], .account-balance__amount');
                } else if (preset === 'binomo') {
                    setCallSelector('.call-btn, vui-button.btn-up, [data-qa="call-button"]');
                    setPutSelector('.put-btn, vui-button.btn-down, [data-qa="put-button"]');
                    setBalanceSelector('.balance-info__sum, [data-qa="header-balance-amount"], .user-balance__amount');
                }
                showNotification('Preset Diubah', `Selector tombol & pembaca saldo disesuaikan untuk ${preset.toUpperCase()}.`, 'info');
            };

            // ================= LISTENER PEMBACA SALDO AKUN LIVE DARI BROKER =================
            useEffect(() => {
                const handleIncomingData = (data) => {
                    if (!data) return;
                    if (data.source === 'BROKER_DOM_READER_V1' && typeof data.balance === 'number' && !isNaN(data.balance)) {
                        setLiveBrokerBalance(data.balance);
                        setLastBalanceSync(data.time || new Date().toLocaleTimeString('id-ID', { hour12: false }));
                        if (data.isInitialSync) {
                            setInitialBalance(data.balance - cumulativeProfit);
                        }
                    }
                };

                let bc;
                try {
                    bc = new BroadcastChannel('bot_trading_engine_v1_channel');
                    bc.onmessage = (ev) => handleIncomingData(ev.data);
                } catch (e) {}

                const storageHandler = (ev) => {
                    if (ev.key === 'BOT_TRADING_LIVE_BALANCE' && ev.newValue) {
                        try {
                            handleIncomingData(JSON.parse(ev.newValue));
                        } catch (e) {}
                    }
                };
                window.addEventListener('storage', storageHandler);

                return () => {
                    if (bc) bc.close();
                    window.removeEventListener('storage', storageHandler);
                };
            }, [cumulativeProfit]);

            // ================= HITUNG STREAK CANDLE SAAT INI =================
            const streakInfo = useMemo(() => {
                if (candleHistory.length === 0) return { count: 0, dir: null };
                const lastDir = candleHistory[candleHistory.length - 1].dir;
                let count = 0;
                for (let i = candleHistory.length - 1; i >= 0; i--) {
                    if (candleHistory[i].dir === lastDir) count++;
                    else break;
                }
                return { count, dir: lastDir };
            }, [candleHistory]);

            // ================= HITUNG SINYAL BERIKUTNYA SECARA REAL-TIME =================
            const nextSignalData = useMemo(() => {
                if (selectedMethod === 'anti_sideway') {
                    return {
                        signal: pingPongSignal,
                        label: pingPongSignal === 'UP' ? 'NAIK (CALL)' : 'TURUN (PUT)',
                        reason: 'Mode Ping-Pong aktif: Berpindah arah otomatis saat WIN untuk menghindari jebakan Sideway.'
                    };
                }
                if (selectedMethod === 'follow_trend') {
                    const lastCandle = candleHistory[candleHistory.length - 1]?.dir || 'UP';
                    return {
                        signal: lastCandle,
                        label: lastCandle === 'UP' ? 'NAIK (CALL)' : 'TURUN (PUT)',
                        reason: `Mengikuti arah penutupan candle terakhir (${lastCandle === 'UP' ? 'HIJAU / NAIK' : 'MERAH / TURUN'}).`
                    };
                }
                if (selectedMethod === 'reversal_5') {
                    if (streakInfo.count >= 5) {
                        const reverseDir = streakInfo.dir === 'UP' ? 'DOWN' : 'UP';
                        return {
                            signal: reverseDir,
                            label: reverseDir === 'UP' ? 'NAIK (CALL)' : 'TURUN (PUT)',
                            reason: `Terdeteksi ${streakInfo.count} candle ${streakInfo.dir === 'UP' ? 'Hijau' : 'Merah'} beruntun! Sinyal Reversal siap dieksekusi.`
                        };
                    } else {
                        return {
                            signal: 'WAIT',
                            label: `MENUNGGU (${streakInfo.count}/5 CANDLE)`,
                            reason: `Baru terbentuk ${streakInfo.count} candle ${streakInfo.dir === 'UP' ? 'Hijau' : 'Merah'} searah. Bot menunggu hingga 5 candle beruntun.`
                        };
                    }
                }
                return { signal: 'UP', label: 'NAIK (CALL)', reason: '' };
            }, [selectedMethod, pingPongSignal, candleHistory, streakInfo]);

            // ================= HITUNG NOMINAL OP BERIKUTNYA (MARTINGALE) =================
            const currentTradeAmount = useMemo(() => {
                if (!martingaleEnabled || currentStep === 0) return Number(baseAmount) || 14000;
                return Math.round((Number(baseAmount) || 14000) * Math.pow(Number(martingaleMultiplier) || 2, currentStep));
            }, [baseAmount, martingaleEnabled, martingaleMultiplier, currentStep]);

            // ================= BROADCAST SINYAL KE BROWSER CONSOLE / EXTENSION =================
            const broadcastSignalToBroker = (signalDir, amount, methodLabel, isZeroDelay = false) => {
                const now = new Date();
                const payload = {
                    source: 'BOT_TRADING_ENGINE_V1',
                    timestamp: now.toISOString(),
                    exactTimeMs: `${now.toLocaleTimeString('id-ID', { hour12: false })}.${String(now.getMilliseconds()).padStart(3, '0')}`,
                    isZeroDelay,
                    action: signalDir === 'UP' ? 'CALL' : 'PUT',
                    direction: signalDir,
                    amount: amount,
                    method: methodLabel,
                    selectors: {
                        call: callSelector,
                        put: putSelector,
                        amount: amountSelector,
                        balance: balanceSelector
                    }
                };
                try {
                    const bc = new BroadcastChannel('bot_trading_engine_v1_channel');
                    bc.postMessage(payload);
                    bc.close();
                } catch (e) {}
                try {
                    localStorage.setItem('BOT_TRADING_LAST_SIGNAL', JSON.stringify(payload));
                } catch (e) {}
            };

            // ================= FUNGSI INTI: SIMULASI & EKSEKUSI CANDLE =================
            const handleTriggerCandle = (candleDirection, isAutoZeroShot = false) => {
                const nowObj = new Date();
                const msStr = String(nowObj.getMilliseconds()).padStart(3, '0');
                const nowStr = `${nowObj.toLocaleTimeString('id-ID', { hour12: false })}.${msStr}`;
                const executionLatency = isAutoZeroShot ? Math.floor(Math.random() * 6) + 2 : Math.floor(Math.random() * 18) + 8;
                
                // 1. Ambil sinyal aktif SEBELUM candle baru masuk
                const activeSignal = nextSignalData.signal;
                const activeMethodObj = STRATEGIES[selectedMethod];

                // 2. Tambahkan candle baru ke riwayat visual
                const updatedCandles = [
                    ...candleHistory.slice(-13),
                    { id: Date.now(), dir: candleDirection, time: nowObj.toLocaleTimeString('id-ID', { hour12: false }) }
                ];
                setCandleHistory(updatedCandles);

                // 3. Evaluasi apakah Bot mengeksekusi transaksi atau hanya memantau
                if (activeSignal === 'WAIT') {
                    let newCount = 0;
                    for (let i = updatedCandles.length - 1; i >= 0; i--) {
                        if (updatedCandles[i].dir === candleDirection) newCount++;
                        else break;
                    }
                    if (newCount >= 5) {
                        showNotification(
                            '5 Candle Searah Terdeteksi!',
                            `Sinyal berikutnya siap OP ${candleDirection === 'UP' ? 'TURUN (PUT)' : 'NAIK (CALL)'}!`,
                            'success'
                        );
                    } else {
                        showNotification(
                            'Monitoring Reversal 5 Candle',
                            `Candle ${candleDirection === 'UP' ? 'HIJAU' : 'MERAH'} tercatat (${newCount}/5). Belum melakukan OP.`,
                            'info'
                        );
                    }
                    return;
                }

                // 4. Evaluasi Hasil Transaksi (WIN / LOSS)
                const isWin = activeSignal === candleDirection;
                const wager = currentTradeAmount;
                const profitDelta = isWin ? Math.round(wager * (payoutRate / 100)) : -wager;
                const updatedTotalProfit = cumulativeProfit + profitDelta;
                const updatedAccountBalance = (liveBrokerBalance !== null ? liveBrokerBalance : initialBalance + cumulativeProfit) + profitDelta;

                if (liveBrokerBalance !== null) {
                    setLiveBrokerBalance(updatedAccountBalance);
                }

                // Broadcast sinyal ke Bridge Script jika bot sedang RUNNING
                if (botStatus === 'RUNNING') {
                    broadcastSignalToBroker(activeSignal, wager, activeMethodObj.shortName, isAutoZeroShot);
                    setShotCount((prev) => prev + 1);
                }

                // 5. Update Step Martingale untuk OP selanjutnya
                let nextMartingaleStep = currentStep;
                if (isWin) {
                    nextMartingaleStep = 0;
                } else {
                    if (martingaleEnabled) {
                        nextMartingaleStep = currentStep + 1 > maxMartingaleStep ? 0 : currentStep + 1;
                    } else {
                        nextMartingaleStep = 0;
                    }
                }
                setCurrentStep(nextMartingaleStep);

                // 6. Update Arah Ping-Pong jika menggunakan Metode 1 (Anti-Sideway)
                if (selectedMethod === 'anti_sideway') {
                    if (isWin) {
                        setPingPongSignal(activeSignal === 'UP' ? 'DOWN' : 'UP');
                    } else {
                        setPingPongSignal(activeSignal);
                    }
                }

                // 7. Catat ke Tabel Log Aktivitas Real-Time
                const newLogItem = {
                    id: `OP-${Math.floor(1000 + Math.random() * 9000)}`,
                    time: nowStr,
                    method: activeMethodObj.shortName,
                    action: activeSignal,
                    candleResult: candleDirection,
                    status: isWin ? 'WIN' : 'LOSS',
                    amount: wager,
                    profitChange: profitDelta,
                    totalProfit: updatedTotalProfit,
                    balanceAfter: updatedAccountBalance,
                    latencyMs: executionLatency,
                    step: currentStep
                };

                setTradeLogs((prev) => [newLogItem, ...prev]);
                setCumulativeProfit(updatedTotalProfit);

                // 8. Cek Target Profit Harian (Take Profit) & Batas Risiko (Stop Loss)
                if (takeProfit > 0 && updatedTotalProfit >= takeProfit) {
                    setBotStatus('PAUSED');
                    showNotification(
                        'TARGET PROFIT TERCAPAI! 🎯',
                        `Profit sesi mencapai ${formatIDR(updatedTotalProfit)}. Bot otomatis dihentikan demi mengamankan profit.`,
                        'success'
                    );
                } else if (stopLoss > 0 && updatedTotalProfit <= -Math.abs(stopLoss)) {
                    setBotStatus('PAUSED');
                    showNotification(
                        'BATAS STOP LOSS TERCAPAI! 🛑',
                        `Kerugian menyentuh batas risiko sesi (${formatIDR(updatedTotalProfit)}). Bot otomatis dihentikan.`,
                        'danger'
                    );
                } else {
                    showNotification(
                        isWin ? `PROFIT (WIN) +${formatIDR(profitDelta)}` : `LOSS ${formatIDR(profitDelta)}`,
                        `${isAutoZeroShot ? '⚡ [0.00s AUTO-SHOT] ' : ''}OP ${activeSignal === 'UP' ? 'NAIK' : 'TURUN'} ${formatIDR(wager)} (${executionLatency}ms).`,
                        isWin ? 'success' : 'danger'
                    );
                }
            };

            // Simpan referensi fungsi agar timer presisi tinggi selalu memanggil state terbaru
            const triggerRef = useRef(handleTriggerCandle);
            const nextSignalRef = useRef(nextSignalData);
            const currentAmountRef = useRef(currentTradeAmount);
            useEffect(() => {
                triggerRef.current = handleTriggerCandle;
                nextSignalRef.current = nextSignalData;
                currentAmountRef.current = currentTradeAmount;
            });

            // ================= HIGH-PRECISION ZERO-DELAY TIMER (requestAnimationFrame) =================
            useEffect(() => {
                let animFrameId;
                const updateHighPrecisionClock = () => {
                    const now = new Date();
                    const sec = now.getSeconds();
                    const ms = now.getMilliseconds();

                    // Hitung total milidetik menuju pergantian menit berikutnya (detik 00.000)
                    setSecondsLeft(sec === 0 ? 0 : 60 - sec);
                    setMsLeft(1000 - ms);

                    // Note: Auto-Shot ke Broker kini sepenuhnya dikendalikan oleh Injected Script di tab Broker
                    // (menggunakan Web Worker) agar tidak terjadi double-trigger dan menghindari tab-throttling.
                    
                    if (botStatus === 'RUNNING' && autoSimOnZero) {
                        const totalMsRemaining = (59 - sec) * 1000 + (1000 - ms);
                        const currentMinuteKey = `${now.getHours()}:${now.getMinutes()}`;
                        if (totalMsRemaining <= preShotLeadMs && lastFiredMinuteRef.current !== currentMinuteKey) {
                            lastFiredMinuteRef.current = currentMinuteKey;
                            const activeSig = nextSignalRef.current?.signal;
                            if (activeSig && activeSig !== 'WAIT') {
                                const randomDir = Math.random() > 0.46 ? 'UP' : 'DOWN';
                                triggerRef.current(randomDir, true);
                            }
                        }
                    }

                    animFrameId = requestAnimationFrame(updateHighPrecisionClock);
                };

                animFrameId = requestAnimationFrame(updateHighPrecisionClock);
                return () => cancelAnimationFrame(animFrameId);
            }, [botStatus, preShotLeadMs, autoSimOnZero]);

            // ================= BROADCAST STATE SINKRONISASI KE TAB BROKER =================
            // Memberi tahu tab broker apa sinyal berikutnya dan status bot, tapi eksekusi dipegang broker tab
            useEffect(() => {
                const payload = {
                    source: 'BOT_TRADING_ENGINE_V1',
                    type: 'SYNC_STATE',
                    botStatus: botStatus,
                    nextSignal: nextSignalData.signal,
                    amount: currentTradeAmount,
                    preTriggerMs: preShotLeadMs
                };
                try {
                    const bc = new BroadcastChannel('bot_trading_engine_v1_channel');
                    bc.postMessage(payload);
                    bc.close();
                } catch (e) {}
            }, [botStatus, nextSignalData, currentTradeAmount, preShotLeadMs]);

            // ================= GENERATE KODE JAVASCRIPT AUTO-CLICKER, BALANCE READER & ZERO-DELAY ENGINE =================
            const generatedBridgeScript = useMemo(() => {
                return `// =========================================================================
// 🦂 SCORPIONS KING v1.0 - FLOATING HUD OVERLAY & ULTRA-STRICT ZERO-DELAY SHOT
// Cara Pakai: Copy script ini -> Buka Tab ${brokerPreset === 'stockity' ? 'Stockity' : 'Binomo'} -> Tekan F12 (Console) -> Paste & Enter
// =========================================================================
(function() {
    console.clear();
    const CONFIG = {
        broker: "${brokerPreset.toUpperCase()}",
        strategy: "${STRATEGIES[selectedMethod].shortName}",
        callSelector: '${callSelector}',
        putSelector: '${putSelector}',
        amountSelector: '${amountSelector}',
        balanceSelector: '${balanceSelector}'
    };

    const channel = new BroadcastChannel('bot_trading_engine_v1_channel');
    let isAutoRunning = false;
    let nextDirection = "${nextSignalData.signal === 'DOWN' ? 'DOWN' : 'UP'}";
    let currentWager = ${currentTradeAmount};
    let preTriggerMs = ${preShotLeadMs};
    let shotTotal = 0;

    console.log("%c[🦂 SCORPIONS KING] Ultra-Strict Sniper Aktif di " + CONFIG.broker + "!", "color:#FACC15; background:#050507; padding:6px 12px; border:1px solid #EAB308; border-radius:6px; font-weight:bold; font-size:13px;");

    // 1. Fungsi Pembaca Nominal Isi Akun (Saldo Real/Demo) Otomatis dari DOM Broker
    function readAndSyncBrokerBalance(isInitial = false) {
        let balEl = document.querySelector(CONFIG.balanceSelector);
        if (!balEl) {
            const allSpans = Array.from(document.querySelectorAll('span, div, p, strong'));
            balEl = allSpans.find(el => {
                const txt = (el.innerText || '').trim();
                return /^Rp\s?[0-9.,]+/.test(txt) && el.children.length === 0 && el.getBoundingClientRect().top < 120;
            });
        }
        if (!balEl) return null;
        const rawText = balEl.innerText || balEl.textContent || "";
        const numericVal = parseInt(rawText.replace(/[^0-9]/g, ""), 10);
        if (!isNaN(numericVal) && numericVal > 0) {
            const payload = {
                source: 'BROKER_DOM_READER_V1',
                balance: numericVal,
                rawText: rawText.trim(),
                time: new Date().toLocaleTimeString('id-ID', { hour12: false }),
                isInitialSync: isInitial
            };
            channel.postMessage(payload);
            try { localStorage.setItem('BOT_TRADING_LIVE_BALANCE', JSON.stringify(payload)); } catch(e) {}
            const hudBal = document.getElementById('sk-hud-balance');
            if (hudBal) hudBal.innerText = "Rp " + numericVal.toLocaleString('id-ID');
            return numericVal;
        }
        return null;
    }

    // Helper Pencari Tombol Hijau (NAIK) & Merah (TURUN) Otomatis
    function findTradeButton(direction) {
        const selector = direction === "UP" ? CONFIG.callSelector : CONFIG.putSelector;
        let btn = document.querySelector(selector);
        if (btn) return btn;

        const buttons = Array.from(document.querySelectorAll('button, [role="button"]')).filter(el => {
            const rect = el.getBoundingClientRect();
            return rect.width > 60 && rect.height > 32 && rect.top > window.innerHeight * 0.5;
        });

        for (const el of buttons) {
            const bg = window.getComputedStyle(el).backgroundColor || '';
            const m = bg.match(/rgb\\((\\d+),\\s*(\\d+),\\s*(\\d+)/);
            if (m) {
                const r = parseInt(m[1], 10), g = parseInt(m[2], 10);
                if (direction === "UP" && g > r + 35 && g > 110) return el;
                if (direction === "DOWN" && r > g + 35 && r > 140) return el;
            }
        }
        return null;
    }

    // 2. Fungsi Instant Shot Tembus React Synthetic Events (Super Strict)
    function triggerZeroDelayShot(direction, amount) {
        const t0 = performance.now();
        const targetBtn = findTradeButton(direction);

        if (!targetBtn) {
            console.warn("[SCORPIONS KING] ⚠️ Tombol " + direction + " tidak ditemukan!");
            const hudStatus = document.getElementById('sk-hud-status');
            if (hudStatus) hudStatus.innerText = "⚠️ Tombol Tidak Ditemukan";
            return;
        }

        // Trik Bypass agar eksekusi klik pasti terbaca platform broker
        if(targetBtn.focus) targetBtn.focus();
        ['pointerover', 'pointerdown', 'mousedown', 'pointerup', 'mouseup', 'click'].forEach(type => {
            targetBtn.dispatchEvent(new MouseEvent(type, { bubbles: true, cancelable: true, view: window, buttons: 1 }));
        });

        shotTotal++;
        const latency = (performance.now() - t0).toFixed(2);
        const hudStatus = document.getElementById('sk-hud-status');
        if (hudStatus) {
            hudStatus.innerText = "⚡ SHOT " + (direction === "UP" ? "HIJAU" : "MERAH") + " (" + latency + "ms)";
        }

        console.log(
            "%c[⚡ ZERO-DELAY SHOT " + latency + "ms] OP " + (direction === "UP" ? "NAIK (CALL) 🟢" : "TURUN (PUT) 🔴") + " | Rp " + amount.toLocaleString('id-ID'),
            "background:#09090b; color:#FACC15; font-weight:bold; padding:4px 8px; border-left:4px solid " + (direction === "UP" ? "#22c55e" : "#ef4444")
        );
        setTimeout(() => readAndSyncBrokerBalance(false), 400);
    }

    // 3. Buat Panel Floating HUD SCORPIONS KING
    const oldHud = document.getElementById('scorpions-king-floating-hud');
    if (oldHud) oldHud.remove();

    const hud = document.createElement('div');
    hud.id = 'scorpions-king-floating-hud';
    hud.style.cssText = 'position:fixed; top:72px; right:20px; width:300px; background:linear-gradient(145deg,#12100B,#050507); border:1.5px solid #EAB308; border-radius:16px; padding:14px; color:#F4F4F6; font-family:Inter,sans-serif; z-index:999999; box-shadow:0 15px 40px rgba(0,0,0,0.9), 0 0 25px rgba(234,179,8,0.25); user-select:none;';
    hud.innerHTML = \`
        <div id="sk-hud-drag" style="display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(234,179,8,0.25);padding-bottom:8px;margin-bottom:10px;cursor:move;">
            <div style="display:flex;align-items:center;gap:8px;">
                <span style="font-size:18px;">🦂</span>
                <div>
                    <div style="font-weight:900;font-size:13px;letter-spacing:1px;color:#FDE047;">SCORPIONS KING</div>
                    <div style="font-size:10px;color:#A1A1AA;">\${CONFIG.broker} • \${CONFIG.strategy}</div>
                </div>
            </div>
            <span id="sk-hud-badge" style="font-size:10px;font-weight:800;padding:3px 8px;border-radius:99px;background:#27272A;color:#FDE047;border:1px solid #EAB308;">STANDBY</span>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;font-size:11px;">
            <div style="background:#09090B;padding:7px 9px;border-radius:10px;border:1px solid rgba(234,179,8,0.2);">
                <div style="color:#A1A1AA;font-size:9px;">SALDO TERBACA</div>
                <div id="sk-hud-balance" style="font-weight:800;color:#FEF08A;margin-top:2px;">Membaca...</div>
            </div>
            <div style="background:#09090B;padding:7px 9px;border-radius:10px;border:1px solid rgba(234,179,8,0.2);">
                <div style="color:#A1A1AA;font-size:9px;">DETIK CANDLE</div>
                <div id="sk-hud-timer" style="font-weight:800;color:#22C55E;font-family:monospace;font-size:13px;margin-top:2px;">00:00.000</div>
            </div>
        </div>
        <div style="background:#09090B;padding:8px 10px;border-radius:10px;border:1px solid rgba(255,255,255,0.08);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;font-size:11px;">
            <span>Sinyal: <strong id="sk-hud-dir" style="color:#22C55E;">\${nextDirection === 'UP' ? 'NAIK (CALL)' : 'TURUN (PUT)'}</strong></span>
            <span id="sk-hud-status" style="font-size:10px;color:#FACC15;">Ready Sniper</span>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px;">
            <button id="sk-btn-call" style="padding:8px;border-radius:9px;background:#16A34A;color:#050507;font-weight:800;font-size:11px;border:none;cursor:pointer;">⚡ SHOT HIJAU</button>
            <button id="sk-btn-put" style="padding:8px;border-radius:9px;background:#DC2626;color:#FFFFFF;font-weight:800;font-size:11px;border:none;cursor:pointer;">⚡ SHOT MERAH</button>
        </div>
        <button id="sk-btn-toggle" style="width:100%;padding:9px;border-radius:10px;background:linear-gradient(180deg,#FEF08A,#CA8A04);color:#050507;font-weight:900;font-size:11px;border:none;cursor:pointer;letter-spacing:0.5px;">
            ▶ AKTIFKAN AUTO-SHOT AWAL MENIT (00:00)
        </button>
    \`;
    document.body.appendChild(hud);

    // Drag (Geser) Panel HUD
    let isDragging = false, offsetX = 0, offsetY = 0;
    const dragHeader = document.getElementById('sk-hud-drag');
    dragHeader.addEventListener('mousedown', (e) => {
        isDragging = true;
        offsetX = e.clientX - hud.getBoundingClientRect().left;
        offsetY = e.clientY - hud.getBoundingClientRect().top;
    });
    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        hud.style.right = 'auto';
        hud.style.left = (e.clientX - offsetX) + 'px';
        hud.style.top = (e.clientY - offsetY) + 'px';
    });
    window.addEventListener('mouseup', () => { isDragging = false; });

    document.getElementById('sk-btn-call').onclick = () => { triggerZeroDelayShot("UP", currentWager); };
    document.getElementById('sk-btn-put').onclick = () => { triggerZeroDelayShot("DOWN", currentWager); };

    function toggleAutoRunStatus(forceStatus = null) {
        isAutoRunning = forceStatus !== null ? forceStatus : !isAutoRunning;
        const btnToggle = document.getElementById('sk-btn-toggle');
        const badge = document.getElementById('sk-hud-badge');
        if (isAutoRunning) {
            if(btnToggle) { btnToggle.innerText = "⏹ HENTIKAN AUTO-SHOT"; btnToggle.style.background = "#DC2626"; btnToggle.style.color = "#FFFFFF"; }
            if(badge) { badge.innerText = "RUNNING"; badge.style.background = "#16A34A"; badge.style.color = "#050507"; }
        } else {
            if(btnToggle) { btnToggle.innerText = "▶ AKTIFKAN AUTO-SHOT AWAL MENIT (00:00)"; btnToggle.style.background = "linear-gradient(180deg,#FEF08A,#CA8A04)"; btnToggle.style.color = "#050507"; }
            if(badge) { badge.innerText = "STANDBY"; badge.style.background = "#27272A"; badge.style.color = "#FDE047"; }
        }
    }
    document.getElementById('sk-btn-toggle').onclick = () => toggleAutoRunStatus();

    // 4. ENGINE TIMER ANTI-THROTTLING (Web Worker Bypass Background Limit)
    // Menghindari browser pause/delay ketika tab broker tidak aktif.
    let lastExecutedMinute = 0;
    
    function tickSniperEngine() {
        const now = Date.now();
        // Hitung menit berikutnya (Tepat 00.000)
        const nextMinuteTime = Math.ceil(now / 60000) * 60000;
        let msUntilNext = nextMinuteTime - now;
        if (msUntilNext === 0) msUntilNext = 60000;

        const sec = new Date(now).getSeconds();
        const remSec = sec === 0 ? 0 : 60 - sec;

        const timerEl = document.getElementById('sk-hud-timer');
        if (timerEl) {
            timerEl.innerText = "00:" + String(remSec).padStart(2, '0') + "." + String(msUntilNext % 1000).padStart(3, '0');
            timerEl.style.color = remSec <= 3 ? "#FACC15" : "#22C55E";
        }

        const dirEl = document.getElementById('sk-hud-dir');
        if (dirEl) {
            dirEl.innerText = nextDirection === "UP" ? "NAIK (CALL)" : nextDirection === "DOWN" ? "TURUN (PUT)" : "WAITING";
            dirEl.style.color = nextDirection === "UP" ? "#22C55E" : nextDirection === "DOWN" ? "#EF4444" : "#A1A1AA";
        }

        // TRIGGER LOGIC STRICT (Berdasarkan sisa milidetik)
        if (isAutoRunning && msUntilNext <= preTriggerMs && lastExecutedMinute !== nextMinuteTime) {
            lastExecutedMinute = nextMinuteTime;
            if (nextDirection !== 'WAIT') {
                triggerZeroDelayShot(nextDirection, currentWager);
            } else {
                console.log("[SCORPIONS KING] Sinyal WAIT, menunda eksekusi di menit ini.");
            }
        }
    }

    // Bypass Background Tab Throttling (Agar tidak delay meski minimize tab)
    const workerBlob = new Blob(["setInterval(() => self.postMessage('tick'), 10);"], { type: 'application/javascript' });
    const worker = new Worker(URL.createObjectURL(workerBlob));
    worker.onmessage = () => tickSniperEngine();

    // Sinkronisasi DOM saldo setiap 2 detik
    readAndSyncBrokerBalance(true);
    setInterval(() => readAndSyncBrokerBalance(false), 2000);

    // 5. Terima Sinyal Sinkronisasi dari Dashboard Web SCORPIONS KING
    channel.onmessage = (event) => {
        const data = event.data;
        if (data && data.source === 'BOT_TRADING_ENGINE_V1' && data.type === 'SYNC_STATE') {
            nextDirection = data.nextSignal;
            currentWager = data.amount;
            preTriggerMs = data.preTriggerMs;
            
            // Sync tombol start/stop Dashboard dengan HUD
            if (data.botStatus === 'RUNNING' && !isAutoRunning) {
                toggleAutoRunStatus(true);
            } else if (data.botStatus !== 'RUNNING' && isAutoRunning) {
                toggleAutoRunStatus(false);
            }
        }
    };
})();`;
            }, [brokerPreset, selectedMethod, baseAmount, martingaleEnabled, martingaleMultiplier, maxMartingaleStep, nextSignalData, preShotLeadMs, callSelector, putSelector, amountSelector, balanceSelector, currentTradeAmount]);

            // Fungsi Simulasi Tarik Saldo dari DOM Stockity/Binomo (One-Click Sync)
            const handleSimulateDomBalanceRead = () => {
                const simulatedRead = liveBrokerBalance !== null
                    ? liveBrokerBalance
                    : initialBalance + cumulativeProfit;
                const nowTime = new Date().toLocaleTimeString('id-ID', { hour12: false });
                setLiveBrokerBalance(simulatedRead);
                setLastBalanceSync(nowTime);
                showNotification(
                    'Saldo Broker Tersinkronisasi!',
                    `Nominal isi akun ${brokerPreset.toUpperCase()} (${accountType}) terbaca: ${formatIDR(simulatedRead)} pada ${nowTime}.`,
                    'success'
                );
            };

            // Fungsi Copy Script ke Clipboard (Kompatibel dengan iFrame)
            const handleCopyScript = () => {
                const textarea = document.createElement('textarea');
                textarea.value = generatedBridgeScript;
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    setCopiedScript(true);
                    showNotification('Script Disalin!', 'Tempel (Paste) script ke tab Console (F12) di halaman Stockity/Binomo Anda.', 'success');
                    setTimeout(() => setCopiedScript(false), 3000);
                } catch (err) {
                    showNotification('Gagal Menyalin', 'Silakan blok dan salin kode secara manual.', 'danger');
                }
                document.body.removeChild(textarea);
            };

            // Fungsi Reset Log & Statistik
            const handleResetLogs = () => {
                setTradeLogs([]);
                setCumulativeProfit(0);
                setCurrentStep(0);
                showNotification('Log Direset', 'Semua riwayat transaksi, step Martingale, dan akumulasi profit telah dikembalikan ke 0.', 'info');
            };

            // Fungsi Download File index.html Siap Upload ke Vercel
            const handleDownloadVercelBundle = () => {
                const fullHtml = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
                const blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'index.html';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showNotification('File index.html Diunduh!', 'File SCORPIONS KING siap di-upload ke GitHub atau Vercel.', 'success');
            };

            // Fungsi Download File Konfigurasi vercel.json
            const handleDownloadVercelConfig = () => {
                const vercelJson = JSON.stringify({
                    name: "scorpions-king-bot",
                    version: 2,
                    cleanUrls: true,
                    framework: null
                }, null, 2);
                const blob = new Blob([vercelJson], { type: 'application/json;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'vercel.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showNotification('vercel.json Diunduh!', 'Simpan vercel.json satu folder dengan index.html.', 'success');
            };

            // Fungsi Export Laporan ke CSV
            const handleExportCSV = () => {
                if (tradeLogs.length === 0) {
                    showNotification('Data Kosong', 'Belum ada riwayat transaksi untuk diekspor.', 'danger');
                    return;
                }
                const headers = ['ID,Waktu,Metode,Aksi OP,Candle Aktual,Status,Step Martingale,Nominal (IDR),Profit/Loss (IDR),Profit Kumulatif (IDR)'];
                const rows = tradeLogs.map(log =>
                    `${log.id},${log.time},"${log.method}",${log.action === 'UP' ? 'NAIK (CALL)' : 'TURUN (PUT)'},${log.candleResult},${log.status},Step ${log.step},${log.amount},${log.profitChange},${log.totalProfit}`
                );
                const csvContent = "data:text/csv;charset=utf-8," + [headers, ...rows].join("\n");
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `Laporan_Trading_Bot_${new Date().toISOString().slice(0,10)}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showNotification('Laporan Diekspor!', 'File CSV berhasil diunduh ke perangkat Anda.', 'success');
            };

            // Statistik Ringkas & Perhitungan Nilai Profit / Loss Sesi Trading Saat Ini
            const stats = useMemo(() => {
                const total = tradeLogs.length;
                const winLogs = tradeLogs.filter(l => l.status === 'WIN');
                const lossLogs = tradeLogs.filter(l => l.status === 'LOSS');
                const wins = winLogs.length;
                const losses = lossLogs.length;
                const winRate = total > 0 ? Math.round((wins / total) * 100) : 0;

                // Total Nilai Profit Kotor (Gross Profit) & Nilai Loss Kotor (Gross Loss) pada sesi ini
                const grossProfitValue = winLogs.reduce((acc, item) => acc + Math.max(0, item.profitChange), 0);
                const grossLossValue = lossLogs.reduce((acc, item) => acc + Math.abs(Math.min(0, item.profitChange)), 0);
                const totalTurnover = tradeLogs.reduce((acc, item) => acc + item.amount, 0);
                const netSessionProfit = grossProfitValue - grossLossValue;
                const currentActiveBalance = liveBrokerBalance !== null ? liveBrokerBalance : initialBalance + netSessionProfit;
                const roiPercent = initialBalance > 0 ? ((netSessionProfit / initialBalance) * 100).toFixed(2) : '0.00';

                return {
                    total,
                    wins,
                    losses,
                    winRate,
                    grossProfitValue,
                    grossLossValue,
                    totalTurnover,
                    netSessionProfit,
                    currentActiveBalance,
                    roiPercent
                };
            }, [tradeLogs, initialBalance, liveBrokerBalance]);

            return (
                <div className="min-h-screen flex flex-col bg-obsidian text-zinc-100 pb-10">

                    {/* Toast Notification Floating */}

                            <button onClick={() => setToastMsg(null)} className="text-zinc-500 hover:text-white">

                        1. HEADER UTAMA (TOP BAR)
                    ===================================================================== */}

                            {/* Kiri: Brand Logo Kalajengking Emas Lingkaran Ganda & Judul SCORPIONS KING */}
                            <div className="flex items-center gap-3.5">

                                    <div className="relative w-14 h-14 rounded-full bg-white border border-amber-300/80 flex items-center justify-center shadow-[0_0_28px_rgba(234,179,8,0.55)] overflow-hidden">
                                        <GoldenScorpionLogo size={56} />
                                    </div>
                                </div>
                                <div>
                                    <div className="flex items-center gap-2.5 flex-wrap">
                                        <h1 className="text-xl sm:text-2xl font-black tracking-widest text-gold-glossy uppercase">
                                            SCORPIONS KING
                                        </h1>
                                        <span className="font-mono text-[10px] font-black px-2.5 py-0.5 rounded-md glossy-white-accent tracking-wider uppercase">
                                            ROYAL GOLD EDITION
                                        </span>

                                            botStatus === 'RUNNING'

                                            <span className={`w-2 h-2 rounded-full ${
                                                botStatus === 'RUNNING' ? 'bg-amber-400 animate-ping' :

                                        <span className={`text-[9px] font-bold px-1.5 py-0.2 rounded ${accountType === 'REAL' ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40' : 'bg-zinc-800 text-zinc-300'}`}>

                                        </span>
                                    </div>
                                    <span className="font-mono text-sm font-extrabold text-gold-glossy">{formatIDR(stats.currentActiveBalance)}</span>

                                <div className="h-7 w-px bg-amber-500/20"></div>

                                <div>

                                    <span>START BOT</span>

                                    className={`flex-1 sm:flex-initial inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl font-bold text-xs sm:text-sm tracking-wide transition-all ${

                                            : 'bg-gradient-to-r from-red-600 to-red-800 hover:from-red-500 hover:to-red-700 text-white border border-red-400/30 shadow-[0_0_25px_rgba(220,38,38,0.4)] active:scale-95'
                                    }`}
                                >

                                    <span>STOP BOT</span>
                                </button>

                        </div>
                    </header>

                    {/* =====================================================================
                        MAIN DASHBOARD GRID (3 KOLOM TERSTRUKTUR & BERSIH)

                            {/* Pengaturan Nominal OP Awal */}

                                <div className="flex items-center justify-between">
                                    <label className="text-xs font-semibold text-zinc-300 flex items-center">

                                    <span className="text-[11px] font-mono text-zinc-400">Default: Rp 14.000</span>
                                </div>
                                <div className="relative flex items-center">
                                    <span className="absolute left-3.5 text-xs font-mono font-bold text-zinc-400">Rp</span>
                                    <input
                                        type="number"
                                        min="1000"
                                        step="1000"
                                        value={baseAmount}
                                        onChange={(e) => setBaseAmount(Math.max(1000, Number(e.target.value)))}
                                        className="w-full bg-zinc-900/90 border border-zinc-700 focus:border-white rounded-xl pl-10 pr-4 py-2.5 text-sm font-mono font-bold text-white outline-none transition-colors"
                                    />
                                </div>
                                {/* Tombol Preset Nominal Cepat */}
                                <div className="grid grid-cols-4 gap-2 pt-1">
                                    {[14000, 28000, 50000, 100000].map((amt) => (
                                        <button
                                            key={amt}
                                            type="button"
                                            onClick={() => setBaseAmount(amt)}
                                            className={`py-1.5 rounded-lg text-xs font-mono font-semibold border transition-all ${
                                                Number(baseAmount) === amt
                                                    ? 'glossy-white-accent border-white font-bold'
                                                    : 'bg-zinc-900/80 border-zinc-800 text-zinc-400 hover:text-white hover:border-zinc-600'
                                            }`}
                                        >
                                            {(amt / 1000)}rb
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Mode Martingale (Kompensasi Kekalahan) */}
                            <div className="p-4 rounded-xl bg-zinc-900/70 border border-amber-500/20 space-y-3.5">
                                <div className="flex items-center justify-between">
                                    <div className="flex items-center">
                                        <span className="text-xs font-bold text-amber-200">Mode Kompensasi Martingale</span>
                                        <InfoTooltip text="Jika OP mengalami LOSS, bot otomatis melipatgandakan nominal OP berikutnya (misal x2.0) agar kerugian sebelumnya langsung tertutup dalam 1x WIN." />
                                    </div>
                                    <button
                                        type="button"
                                        onClick={() => {
                                            setMartingaleEnabled(!martingaleEnabled);
                                            setCurrentStep(0);
                                        }}
                                        className={`w-12 h-6 rounded-full p-1 transition-colors flex items-center ${
                                            martingaleEnabled ? 'bg-amber-500 justify-end' : 'bg-zinc-700 justify-start'

                                    >
                                        <span className="w-4 h-4 rounded-full bg-black shadow-md"></span>
                                    </button>
                                </div>

                                {martingaleEnabled && (
                                    <div className="space-y-3 pt-1 border-t border-white/10">
                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="text-[11px] text-zinc-400 block mb-1">Pengali Lipatan (x)</label>
                                                <input
                                                    type="number"
                                                    step="0.1"
                                                    min="1.1"
                                                    max="5.0"
                                                    value={martingaleMultiplier}
                                                    onChange={(e) => setMartingaleMultiplier(Number(e.target.value))}
                                                    className="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-1.5 text-xs font-mono font-bold text-white outline-none"
                                                />
                                            </div>
                                            <div>
                                                <label className="text-[11px] text-zinc-400 block mb-1">Maksimal Step (Max {maxMartingaleStep}x)</label>

                                                    value={maxMartingaleStep}
                                                    onChange={(e) => setMaxMartingaleStep(Number(e.target.value))}
                                                    className="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-2.5 py-1.5 text-xs font-mono font-bold text-white outline-none"
                                                >
                                                    <option value={1}>Max 1x Kompensasi</option>
                                                    <option value={2}>Max 2x Kompensasi</option>
                                                    <option value={3}>Max 3x Kompensasi</option>
                                                    <option value={4}>Max 4x Kompensasi</option>
                                                    <option value={5}>Max 5x Kompensasi</option>
                                                </select>
                                            </div>
                                        </div>

                                        {/* Simulasi Urutan Step Martingale */}
                                        <div className="space-y-1">
                                            <span className="text-[10px] uppercase tracking-wider text-zinc-400 block">Preview Tahapan Nominal OP:</span>
                                            <div className="flex flex-wrap gap-1.5">
                                                {Array.from({ length: maxMartingaleStep + 1 }).map((_, idx) => {
                                                    const stepVal = Math.round(baseAmount * Math.pow(martingaleMultiplier, idx));
                                                    const isCurrent = currentStep === idx;
                                                    return (
                                                        <div
                                                            key={idx}
                                                            className={`px-2 py-1 rounded-md text-[11px] font-mono border ${
                                                                isCurrent
                                                                    ? 'glossy-white-accent font-extrabold'
                                                                    : 'bg-zinc-950/80 border-zinc-800 text-zinc-400'
                                                            }`}
                                                        >
                                                            {idx === 0 ? 'Awal: ' : `K${idx}: `}
                                                            {formatIDR(stepVal)}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>

                            {/* Target Profit Harian (Take Profit) & Batas Risiko (Stop Loss) */}
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
                                <div className="p-3 rounded-xl bg-emerald-950/20 border border-emerald-500/20 space-y-1.5">
                                    <label className="text-xs font-semibold text-emerald-400 flex items-center">
                                        <span>Target Profit (TP)</span>
                                        <InfoTooltip text="Bot otomatis berhenti (PAUSED) ketika total keuntungan bersih hari ini mencapai angka Take Profit ini." />
                                    </label>
                                    <div className="relative flex items-center">
                                        <span className="absolute left-2.5 text-xs font-mono text-emerald-500">Rp</span>
                                        <input
                                            type="number"
                                            step="10000"
                                            value={takeProfit}
                                            onChange={(e) => setTakeProfit(Math.max(0, Number(e.target.value)))}
                                            className="w-full bg-zinc-950/90 border border-emerald-500/30 rounded-lg pl-8 pr-2 py-1.5 text-xs font-mono font-bold text-white outline-none"
                                        />
                                    </div>
                                </div>

                                <div className="p-3 rounded-xl bg-red-950/20 border border-red-500/20 space-y-1.5">
                                    <label className="text-xs font-semibold text-red-400 flex items-center">
                                        <span>Stop Loss (SL)</span>
                                        <InfoTooltip text="Batas aman kerugian harian. Jika saldo minus menyentuh angka ini, bot langsung berhenti agar modal utama Anda tetap aman." />
                                    </label>
                                    <div className="relative flex items-center">
                                        <span className="absolute left-2.5 text-xs font-mono text-red-500">Rp</span>
                                        <input
                                            type="number"
                                            step="10000"
                                            value={stopLoss}
                                            onChange={(e) => setStopLoss(Math.max(0, Number(e.target.value)))}
                                            className="w-full bg-zinc-950/90 border border-red-500/30 rounded-lg pl-8 pr-2 py-1.5 text-xs font-mono font-bold text-white outline-none"
                                        />
                                    </div>
                                </div>
                            </div>
                        </section>

                        {/* =================================================================
                            3. PANEL TENGAH: MONITORING CHART, TIMING & SIMULATOR (4 KOLOM)
                        ================================================================= */}
                        <section className="lg:col-span-4 bg-glossy-dark border-glossy rounded-2xl p-5 flex flex-col gap-5">
                            {/* Header Panel Tengah */}
                            <div className="flex items-center justify-between border-b border-amber-500/20 pb-3.5">
                                <div className="flex items-center gap-2.5">
                                    <span className="w-8 h-8 rounded-xl matte-crimson flex items-center justify-center font-bold">
                                        <Icon name="activity" size={16} />
                                    </span>
                                    <div>
                                        <h2 className="text-sm font-bold uppercase tracking-wider text-gold-glossy">2. Zero-Delay Shot & Simulator</h2>
                                        <p className="text-[11px] text-zinc-400">Eksekusi OP awal menit 00:00.000 tanpa delay</p>
                                    </div>
                                </div>
                                <span className="text-[11px] font-mono px-2.5 py-1 rounded-lg bg-amber-500/15 border border-amber-500/40 text-amber-300 font-bold">
                                    Shots: {shotCount}x
                                </span>
                            </div>

                            {/* Live Countdown Timer Presisi Milidetik & Zero-Delay Auto-Shot */}
                            <div className="p-4 rounded-2xl bg-gradient-to-b from-zinc-900 to-zinc-950 border border-amber-500/25 relative overflow-hidden space-y-3">
                                <div className="flex items-center justify-between">
                                    <div>
                                        <div className="flex items-center">
                                            <span className="text-xs font-semibold text-amber-200/80 uppercase tracking-wider">Timer Pergantian Candle</span>
                                            <InfoTooltip text="Menggunakan High-Resolution Timer (milidetik) agar Bot menembakkan klik OP tepat di awal pergantian candle baru (00:00.000) tanpa terlambat 1 detik pun." />
                                        </div>
                                        <div className="flex items-baseline gap-1.5 mt-1">
                                            <span className={`font-mono text-3xl sm:text-4xl font-extrabold tracking-tight ${
                                                secondsLeft <= 3 ? 'text-amber-400 animate-pulse-fast' : 'text-gold-glossy'
                                            }`}>
                                                00:{String(secondsLeft).padStart(2, '0')}
                                            </span>
                                            <span className="font-mono text-sm font-bold text-amber-400">
                                                .{String(msLeft % 1000).padStart(3, '0')}
                                            </span>
                                            <span className="text-[11px] text-zinc-400 ml-1">ms</span>
                                        </div>
                                    </div>

                                    <div className="text-right">
                                        <span className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-extrabold ${
                                            secondsLeft <= 3
                                                ? 'glossy-white-accent'
                                                : 'bg-zinc-900 text-amber-300 border border-amber-500/30'
                                        }`}>
                                            <Icon name="zap" size={13} />
