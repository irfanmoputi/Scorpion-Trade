                                        <div className="mt-2 flex items-center justify-end gap-2">
                                            <label className="text-[11px] text-zinc-300 cursor-pointer select-none flex items-center gap-1.5">
                                                <input
                                                    type="checkbox"
                                                    checked={autoSimOnZero}
                                                    onChange={(e) => setAutoSimOnZero(e.target.checked)}
                                                    className="accent-amber-500 rounded cursor-pointer"
                                                />
                                                <span>Auto-Simulasi Detik 00</span>
                                            </label>
                                        </div>
                                    </div>
                                </div>

                                {/* Progress Bar Detik Gold Glossy */}
                                <div className="w-full h-2 bg-zinc-900 rounded-full overflow-hidden border border-amber-500/20">
                                    <div
                                        className="h-full transition-all duration-150 bg-gradient-to-r from-amber-600 via-yellow-400 to-amber-200"
                                        style={{ width: `${((60 - secondsLeft) / 60) * 100}%` }}
                                    ></div>
                                </div>

                                {/* Panel Kontrol Kecepatan Shot / Pre-Trigger Milidetik */}
                                <div className="pt-2 border-t border-white/10 flex flex-wrap items-center justify-between gap-2 text-xs">
                                    <div className="flex items-center gap-2">
                                        <button
                                            type="button"
                                            onClick={() => setZeroDelayShot(!zeroDelayShot)}
                                            className={`px-2.5 py-1 rounded-lg font-bold text-[11px] flex items-center gap-1.5 border transition-all ${
                                                zeroDelayShot
                                                    ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40'
                                                    : 'bg-zinc-900 text-zinc-400 border-zinc-700'
                                            }`}
                                        >
                                            <Icon name="crosshair" size={13} />
                                            <span>Auto-Shot Awal Menit: {zeroDelayShot ? 'ON' : 'OFF'}</span>
                                        </button>
                                        <InfoTooltip text="Kompensasi Ping/Jaringan: Menembakkan sinyal beberapa milidetik sebelum detik 00.000 agar order diterima server Stockity/Binomo tepat di titik pembukaan candle baru tanpa delay." />
                                    </div>

                                    <div className="flex items-center gap-1.5">
                                        <span className="text-[11px] text-zinc-400">Kompensasi Ping:</span>
                                        <select
                                            value={preShotLeadMs}
                                            onChange={(e) => setPreShotLeadMs(Number(e.target.value))}
                                            className="bg-zinc-900 border border-zinc-700 rounded-lg px-2 py-1 text-[11px] font-mono font-bold text-white outline-none"
                                        >
                                            <option value={50}>0ms (Tepat 00.000s)</option>
                                            <option value={150}>-150ms (Cepat / Fiber)</option>
                                            <option value={300}>-300ms (Anti-Delay 4G)</option>
                                            <option value={500}>-500ms (Ultra Pre-Shot)</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            {/* STATUS INDIKATOR: PREDIKSI SINYAL BERIKUTNYA */}
                            <div className={`p-4 rounded-2xl border transition-all ${
                                nextSignalData.signal === 'UP'
                                    ? 'bg-gradient-to-br from-emerald-950/60 via-zinc-900 to-zinc-950 border-emerald-500/40 shadow-[0_0_25px_rgba(16,185,129,0.12)]'
                                    : nextSignalData.signal === 'DOWN'
                                    ? 'bg-gradient-to-br from-red-950/60 via-zinc-900 to-zinc-950 border-red-500/40 shadow-[0_0_25px_rgba(239,68,68,0.12)]'
                                    : 'bg-zinc-900/90 border-amber-500/30'
                            }`}>
                                <div className="flex items-center justify-between mb-2">
                                    <span className="text-xs font-bold uppercase tracking-wider text-zinc-300 flex items-center">
                                        <Icon name="radar" size={15} className="mr-1.5 text-red-400" />
                                        Prediksi Sinyal Berikutnya
                                        <InfoTooltip text="Keputusan yang akan diambil oleh Bot pada penutupan candle saat ini berdasarkan metode yang Anda pilih di Panel Kiri." />
                                    </span>
                                    <span className="text-xs font-mono font-bold px-2.5 py-0.5 rounded-md bg-black/40 border border-white/10 text-white">
                                        OP: {formatIDR(currentTradeAmount)} {currentStep > 0 ? `(Step ${currentStep})` : ''}
                                    </span>
                                </div>

                                <div className="flex items-center justify-between gap-3 my-2">
                                    <div className="flex items-center gap-3">
                                        <div className={`w-12 h-12 rounded-2xl flex items-center justify-center font-extrabold shadow-lg ${
                                            nextSignalData.signal === 'UP'
                                                ? 'bg-emerald-500 text-zinc-950'
                                                : nextSignalData.signal === 'DOWN'
                                                ? 'bg-red-600 text-white'
                                                : 'bg-amber-500/20 text-amber-300 border border-amber-500/40'
                                        }`}>
                                            <Icon
                                                name={nextSignalData.signal === 'UP' ? 'trending-up' : nextSignalData.signal === 'DOWN' ? 'trending-down' : 'hourglass'}
                                                size={26}
                                            />
                                        </div>
                                        <div>
                                            <div className="text-[11px] text-zinc-400 uppercase">Sinyal Berikutnya:</div>
                                            <div className={`text-xl sm:text-2xl font-extrabold tracking-tight ${
                                                nextSignalData.signal === 'UP' ? 'text-emerald-400' :
                                                nextSignalData.signal === 'DOWN' ? 'text-red-400' : 'text-amber-300'
                                            }`}>
                                                {nextSignalData.label}
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <p className="text-xs text-zinc-300 bg-black/30 rounded-xl p-2.5 border border-white/5 leading-relaxed">
                                    {nextSignalData.reason}
                                </p>
                            </div>

                            {/* Visualisasi Urutan Candle Terakhir */}
                            <div className="space-y-2">
                                <div className="flex items-center justify-between text-xs">
                                    <span className="font-semibold text-zinc-300 flex items-center">
                                        <span>Visualisasi History Candle Terakhir</span>
                                        <InfoTooltip text="Menampilkan urutan warna candle yang terbentuk. Sangat membantu untuk memantau streak (candle beruntun) pada Metode 3." />
                                    </span>
                                    <span className="font-mono text-[11px] text-zinc-400">
                                        Streak: <strong className={streakInfo.dir === 'UP' ? 'text-emerald-400' : 'text-red-400'}>{streakInfo.count}x {streakInfo.dir === 'UP' ? 'Hijau' : 'Merah'}</strong>
                                    </span>
                                </div>

                                <div className="p-3.5 rounded-xl bg-zinc-950 border border-white/10 flex items-center justify-between gap-1.5 overflow-x-auto">
                                    {candleHistory.slice(-10).map((c, idx, arr) => {
                                        const isLatest = idx === arr.length - 1;
                                        return (
                                            <div key={c.id} className="flex flex-col items-center gap-1 min-w-[26px]">
                                                {/* Sumbu Atas */}
                                                <div className={`w-0.5 h-2 ${c.dir === 'UP' ? 'bg-emerald-500/60' : 'bg-red-500/60'}`}></div>
                                                {/* Body Candle */}
                                                <div className={`w-5 h-9 rounded-sm flex items-center justify-center text-[9px] font-mono font-bold transition-all ${
                                                    c.dir === 'UP'
                                                        ? 'bg-emerald-500 text-zinc-950 shadow-[0_0_10px_rgba(16,185,129,0.3)]'
                                                        : 'bg-red-600 text-white shadow-[0_0_10px_rgba(220,38,38,0.3)]'
                                                } ${isLatest ? 'ring-2 ring-white scale-110' : 'opacity-85'}`}>
                                                    {c.dir === 'UP' ? '▲' : '▼'}
                                                </div>
                                                {/* Sumbu Bawah */}
                                                <div className={`w-0.5 h-2 ${c.dir === 'UP' ? 'bg-emerald-500/60' : 'bg-red-500/60'}`}></div>
                                                <span className="text-[9px] font-mono text-zinc-500">{isLatest ? 'Baru' : idx + 1}</span>
                                            </div>
                                        );
                                    })}

                            {/* PANEL SIMULASI PERGERAKAN CHART (MANUAL TESTING) */}
                            <div className="space-y-2.5 pt-1 border-t border-white/10">

                                    </label>

                                    >
                                        <Icon name="arrow-down-circle" size={18} />
                                        <span>Simulasi Candle TURUN (Merah)</span>
                                    </button>
                                </div>
                            </div>
                        </section>

                        {/* =================================================================
                            4. PANEL KANAN: EKSEKUSI & SCRIPT GENERATOR (4 KOLOM)
                        ================================================================= */}
                        <section className="lg:col-span-4 bg-glossy-dark border-glossy rounded-2xl p-5 flex flex-col gap-4">

                                        <Icon name="terminal" size={16} />

                                <button

                                        activeRightTab === 'script'
                                            ? 'glossy-white-accent shadow'

                                    <Icon name="code-2" size={13} />

                                <button

                                        activeRightTab === 'vercel'

                                            : 'text-amber-300 hover:text-white'
                                    }`}
                                >
                                    <Icon name="rocket" size={13} />
                                    <span>Vercel</span>
                                </button>
                            </div>

                            {/* Ringkasan Panduan Singkat (Selalu Tampil agar Tidak Bingung) */}
                            <div className="p-3 rounded-xl bg-zinc-900/80 border border-amber-500/20 text-xs text-zinc-300 space-y-1">
                                <div className="font-bold text-amber-300 flex items-center gap-1.5">
                                    <Icon name="zap" size={14} className="text-amber-400" />
                                    <span>3 Langkah Cepat Menghubungkan SCORPIONS KING:</span>
                                </div>
                                <ol className="list-decimal list-inside space-y-0.5 text-[11px] text-zinc-300 pl-1">
                                    <li>Klik tombol <strong>One-Click Copy Script</strong> di bawah.</li>
                                    <li>Buka tab <strong>{brokerPreset === 'stockity' ? 'Stockity' : 'Binomo'}</strong> di browser, tekan <strong>F12</strong> lalu pilih tab <strong>Console</strong>.</li>
                                    <li><strong>Paste (Ctrl+V)</strong> kode tersebut lalu tekan <strong>Enter</strong>. Selesai!</li>
                                </ol>
                            </div>

                            {/* KONTEN TAB 1: KOTAK KODE SCRIPT OTOMATIS */}
                            {activeRightTab === 'script' && (
                                <div className="space-y-3 flex-1 flex flex-col">
                                    <div className="relative flex-1">
                                        <pre className="w-full h-56 overflow-y-auto bg-zinc-950 border border-amber-500/30 rounded-xl p-3.5 text-[11px] font-mono text-amber-300 leading-relaxed select-all">
                                            {generatedBridgeScript}
                                        </pre>
                                        <span className="absolute top-2.5 right-3 text-[10px] font-mono px-2 py-0.5 rounded bg-zinc-900 text-amber-300 border border-amber-500/30">
                                            SCORPIONS KING JS
                                        </span>
                                    </div>

                                    <button
                                        type="button"
                                        onClick={handleCopyScript}
                                        className={`w-full py-3 px-4 rounded-xl font-extrabold text-xs uppercase tracking-wider flex items-center justify-center gap-2 transition-all ${
                                            copiedScript
                                                ? 'bg-emerald-500 text-zinc-950 shadow-lg shadow-emerald-500/30'
                                                : 'glossy-white-accent hover:brightness-110 active:scale-98'
                                        }`}
                                    >
                                        <Icon name={copiedScript ? 'check' : 'copy'} size={16} />
                                        <span>{copiedScript ? 'BERHASIL DISALIN KE CLIPBOARD!' : 'ONE-CLICK COPY SCRIPT OTOMATIS'}</span>
                                    </button>
                                </div>
                            )}

                            {/* KONTEN TAB 2: PANDUAN LENGKAP STEP-BY-STEP DI ATAS STOCKITY / BINOMO */}
                            {activeRightTab === 'guide' && (
                                <div className="space-y-3 bg-zinc-950/95 border border-amber-500/30 rounded-xl p-4 text-xs text-zinc-300 leading-relaxed max-h-80 overflow-y-auto">
                                    <h3 className="font-extrabold text-amber-300 text-sm flex items-center gap-2">
                                        <Icon name="layers" size={16} className="text-amber-400" />
                                        Panduan Step-by-Step Muncul di Atas Layar Stockity / Binomo
                                    </h3>
                                    <p className="text-[11px] text-zinc-300">
                                        Script <strong>SCORPIONS KING</strong> sudah dilengkapi fitur <strong>Floating HUD Overlay</strong> (kotak panel melayang Hitam-Gold yang tampil langsung di atas grafik candlestick Stockity/Binomo Anda):
                                    </p>
                                    <div className="space-y-2 pt-1 text-[11px]">
                                        <div className="p-2.5 rounded-lg bg-zinc-900 border border-amber-500/20">
                                            <strong className="text-amber-300 block">Langkah 1: Atur Strategi & Salin Script</strong>
                                            Pilih broker (<strong>Stockity</strong> atau <strong>Binomo</strong>) dan strategi di Panel Kiri, lalu buka tab <strong>Script</strong> dan klik tombol emas <strong>ONE-CLICK COPY SCRIPT OTOMATIS</strong>.
                                        </div>
                                        <div className="p-2.5 rounded-lg bg-zinc-900 border border-amber-500/20">
                                            <strong className="text-amber-300 block">Langkah 2: Buka Halaman Trading Stockity / Binomo</strong>
                                            Login ke akun Stockity atau Binomo Anda di Google Chrome / Edge, pilih aset (misal <em>Crypto IDX</em>) dan pastikan durasi waktu chart disetel ke <strong>1 Menit (1m)</strong>.
                                        </div>
                                        <div className="p-2.5 rounded-lg bg-zinc-900 border border-amber-500/20">
                                            <strong className="text-amber-300 block">Langkah 3: Buka Console Browser (F12)</strong>
                                            Tekan tombol <strong>F12</strong> (atau klik kanan di layar &rarr; pilih <strong>Inspect / Inspeksi</strong>), lalu klik menu tab <strong>Console</strong> di bagian atas panel yang terbuka.
                                        </div>
                                        <div className="p-2.5 rounded-lg bg-zinc-900 border border-amber-500/20">
                                            <strong className="text-amber-300 block">Langkah 4: Paste Script & Tekan Enter</strong>
                                            <em>Catatan Penting:</em> Jika baru pertama kali membuka Console Chrome dan muncul peringatan <em>"Paste protection"</em>, ketik <code className="text-amber-300 font-mono">allow pasting</code> lalu tekan <strong>Enter</strong>. Setelah itu tekan <strong>Ctrl + V (Paste)</strong> dan tekan <strong>Enter</strong>.
                                        </div>
                                        <div className="p-2.5 rounded-lg bg-zinc-900 border border-emerald-500/30">
                                            <strong className="text-emerald-400 block">Langkah 5: Panel Melayang SCORPIONS KING Muncul di Atas Chart!</strong>
                                            Tepat di pojok kanan atas grafik Stockity/Binomo Anda akan muncul kotak <strong>🦂 SCORPIONS KING Floating HUD</strong> yang bisa digeser-geser. Klik tombol <strong>▶ AKTIFKAN AUTO-SHOT AWAL MENIT (00:00)</strong> pada panel melayang tersebut atau jalankan dari dashboard ini!
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* KONTEN TAB 3: CUSTOM CSS SELECTOR INPUT */}
                            {activeRightTab === 'config' && (
                                <div className="space-y-3 bg-zinc-950/90 border border-zinc-800 rounded-xl p-4">
                                    <div className="flex items-center justify-between">
                                        <span className="text-xs font-bold text-white flex items-center">
                                            <span>Custom CSS Selector Broker</span>
                                            <InfoTooltip text="Jika suatu saat Stockity atau Binomo memperbarui tampilan websitenya dan mengubah nama class tombol, Anda cukup mengganti selector di bawah ini." />
                                        </span>
                                    </div>

                                    <div className="space-y-2">
                                        <div>
                                            <label className="text-[11px] text-emerald-400 font-semibold block mb-1">
                                                Selector Tombol NAIK (CALL / HIJAU):
                                            </label>
                                            <input
                                                type="text"
                                                value={callSelector}
                                                onChange={(e) => setCallSelector(e.target.value)}
                                                className="w-full bg-zinc-900 border border-zinc-700 focus:border-emerald-500 rounded-lg px-3 py-2 text-xs font-mono text-white outline-none"
                                            />
                                        </div>

                                        <div>
                                            <label className="text-[11px] text-red-400 font-semibold block mb-1">
                                                Selector Tombol TURUN (PUT / MERAH):
                                            </label>
                                            <input
                                                type="text"
                                                value={putSelector}
                                                onChange={(e) => setPutSelector(e.target.value)}
                                                className="w-full bg-zinc-900 border border-zinc-700 focus:border-red-500 rounded-lg px-3 py-2 text-xs font-mono text-white outline-none"
                                            />
                                        </div>

                                        <div>
                                            <label className="text-[11px] text-zinc-400 font-semibold block mb-1">
                                                Selector Input Nominal (Amount):
                                            </label>
                                            <input
                                                type="text"
                                                value={amountSelector}
                                                onChange={(e) => setAmountSelector(e.target.value)}
                                                className="w-full bg-zinc-900 border border-zinc-700 focus:border-white rounded-lg px-3 py-2 text-xs font-mono text-white outline-none"
                                            />
                                        </div>

                                        <div>
                                            <label className="text-[11px] text-amber-400 font-semibold block mb-1">
                                                Selector Pembaca Saldo Akun (DOM Balance Reader):
                                            </label>
                                            <input
                                                type="text"
                                                value={balanceSelector}
                                                onChange={(e) => setBalanceSelector(e.target.value)}
                                                className="w-full bg-zinc-900 border border-zinc-700 focus:border-amber-400 rounded-lg px-3 py-2 text-xs font-mono text-white outline-none"
                                            />
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* KONTEN TAB 4: PANDUAN DEPLOY KE VERCEL */}
                            {activeRightTab === 'vercel' && (
                                <div className="space-y-3 bg-zinc-950/95 border border-amber-500/40 rounded-xl p-4 text-xs text-zinc-300 leading-relaxed">
                                    <div className="flex items-center justify-between">
                                        <h3 className="font-extrabold text-amber-300 text-sm flex items-center gap-2">
                                            <Icon name="rocket" size={16} className="text-amber-400" />
                                            Deploy SCORPIONS KING ke Vercel
                                        </h3>
                                        <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-500/40">
                                            Production Ready
                                        </span>
                                    </div>
                                    <p className="text-[11px] text-zinc-300">
                                        Unduh kedua file di bawah ini ke dalam 1 folder di komputer/HP Anda, lalu unggah ke <strong>Vercel</strong>:
                                    </p>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                        <button
                                            type="button"
                                            onClick={handleDownloadVercelBundle}
                                            className="py-2.5 px-3 rounded-xl glossy-white-accent font-extrabold text-[11px] uppercase tracking-wider flex items-center justify-center gap-1.5 hover:brightness-110 transition-all"
                                        >
                                            <Icon name="download" size={14} />
                                            <span>1. Unduh index.html</span>
                                        </button>
                                        <button
                                            type="button"
                                            onClick={handleDownloadVercelConfig}
                                            className="py-2.5 px-3 rounded-xl bg-zinc-900 hover:bg-zinc-800 text-amber-300 border border-amber-500/40 font-extrabold text-[11px] uppercase tracking-wider flex items-center justify-center gap-1.5 transition-all"
                                        >
                                            <Icon name="file-json" size={14} />
                                            <span>2. Unduh vercel.json</span>
                                        </button>
                                    </div>
                                    <div className="space-y-2 text-[11px]">
                                        <div className="p-2.5 rounded-lg bg-zinc-900 border border-amber-500/25">
                                            <strong className="text-amber-300 block mb-0.5">Cara 1: Tanpa Coding via GitHub + Vercel (Paling Mudah)</strong>
                                            1. Klik tombol <strong>1. Unduh index.html</strong> dan <strong>2. Unduh vercel.json</strong> di atas.<br/>
                                            2. Buka <strong>github.com/new</strong>, buat repository bernama <code className="text-amber-200 font-mono">scorpions-king</code> lalu upload kedua file tersebut.<br/>
                                            3. Login ke <strong>vercel.com</strong> &rarr; klik <strong>Add New Project</strong> &rarr; <strong>Import</strong> repository <code className="text-amber-200 font-mono">scorpions-king</code> &rarr; klik <strong>Deploy</strong>.
                                        </div>
                                        <div className="p-2.5 rounded-lg bg-zinc-900 border border-amber-500/25">
                                            <strong className="text-amber-300 block mb-0.5">Cara 2: Deploy Instan via Terminal (Vercel CLI)</strong>
                                            Simpan <code className="text-amber-200 font-mono">index.html</code> dan <code className="text-amber-200 font-mono">vercel.json</code> di satu folder, lalu jalankan perintah ini di Terminal:
                                            <pre className="mt-1.5 p-2 rounded bg-black text-amber-300 font-mono text-[10px] select-all border border-amber-500/30">npx vercel --prod</pre>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </section>
                    </main>

                    {/* =====================================================================
                        5. BAGIAN BAWAH (FOOTER DASHBOARD): REKAP NILAI PROFIT/LOSS SESI & TABEL LOG
                    ===================================================================== */}
                    <footer className="relative z-10 max-w-[1600px] w-full mx-auto px-4 sm:px-6 mt-6">
                        <div className="bg-glossy-dark border-glossy rounded-2xl p-5 space-y-5">
                            
                            {/* Baris Atas Footer: Judul & Tombol Aksi */}
                            <div className="flex flex-wrap items-center justify-between gap-4 border-b border-amber-500/20 pb-4">
                                <div className="flex items-center gap-3">
                                    <span className="w-9 h-9 rounded-xl matte-crimson flex items-center justify-center font-bold">
                                        <Icon name="bar-chart-3" size={18} />
                                    </span>
                                    <div>
                                        <h2 className="text-sm sm:text-base font-bold uppercase tracking-wider text-gold-glossy flex items-center">
                                            <span>Ringkasan Sesi Trading SCORPIONS KING & Riwayat Real-Time</span>
                                            <InfoTooltip text="Menampilkan total nilai uang yang dimenangkan (Nilai Profit), total nilai kekalahan (Nilai Loss), serta selisih bersih pada sesi trading saat ini." />
                                        </h2>
                                        <p className="text-xs text-zinc-400">
                                            Total Eksekusi: <strong className="text-white">{stats.total} OP</strong> • Win Rate: <strong className="text-emerald-400">{stats.winRate}%</strong> ({stats.wins} WIN / {stats.losses} LOSS) • Perputaran Modal: <strong className="text-zinc-200 font-mono">{formatIDR(stats.totalTurnover)}</strong>
                                        </p>
                                    </div>
                                </div>

                                {/* Tombol Reset Log & Export Laporan */}
                                <div className="flex items-center gap-2.5">
                                    <button
                                        type="button"
                                        onClick={handleResetLogs}
                                        className="px-4 py-2 rounded-xl bg-zinc-900 hover:bg-zinc-800 text-zinc-300 hover:text-white border border-zinc-700 text-xs font-bold flex items-center gap-1.5 transition-all"
                                    >
                                        <Icon name="rotate-ccw" size={14} />
                                        <span>Reset Sesi & Log</span>
                                    </button>

                                    <button
                                        type="button"
                                        onClick={handleExportCSV}
                                        className="px-4 py-2 rounded-xl glossy-white-accent hover:opacity-90 text-xs font-extrabold flex items-center gap-1.5 transition-all"
                                    >
                                        <Icon name="download" size={14} />
                                        <span>Export Laporan (CSV)</span>
                                    </button>
                                </div>
                            </div>

                            {/* KARTU REKAPITULASI NILAI PROFIT & NILAI LOSS PADA SESI TRADING SAAT INI */}
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3.5">
                                {/* Kartu 1: Saldo Akun Saat Ini */}
                                <div className="p-4 rounded-xl bg-zinc-900/90 border border-white/10 flex items-center justify-between">
                                    <div>
                                        <span className="text-[11px] font-semibold uppercase tracking-wider text-zinc-400 block">
                                            Saldo Akun ({brokerPreset.toUpperCase()} {accountType})
                                        </span>
                                        <span className="font-mono text-lg sm:text-xl font-extrabold text-white mt-0.5 block">
                                            {formatIDR(stats.currentActiveBalance)}
                                        </span>
                                        <span className="text-[11px] text-zinc-400">
                                            Modal Awal: {formatIDR(initialBalance)}
                                        </span>
                                    </div>
                                    <div className="w-10 h-10 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-white">
                                        <Icon name="wallet" size={20} />
                                    </div>
                                </div>

                                {/* Kartu 2: Nilai Profit Sesi Ini (Gross Profit) */}
                                <div className="p-4 rounded-xl bg-emerald-950/25 border border-emerald-500/30 flex items-center justify-between">
                                    <div>
                                        <span className="text-[11px] font-semibold uppercase tracking-wider text-emerald-300 block">
                                            Nilai Profit Sesi Ini ({stats.wins}x WIN)
                                        </span>
                                        <span className="font-mono text-lg sm:text-xl font-extrabold text-emerald-400 mt-0.5 block">
                                            +{formatIDR(stats.grossProfitValue)}
                                        </span>
                                        <span className="text-[11px] text-emerald-300/70">
                                            Akumulasi kemenangan kotor
                                        </span>
                                    </div>
                                    <div className="w-10 h-10 rounded-xl bg-emerald-500/20 border border-emerald-500/30 flex items-center justify-center text-emerald-400">
                                        <Icon name="trending-up" size={20} />
                                    </div>
                                </div>

                                {/* Kartu 3: Nilai Loss Sesi Ini (Gross Loss) */}
                                <div className="p-4 rounded-xl bg-red-950/25 border border-red-500/30 flex items-center justify-between">
                                    <div>
                                        <span className="text-[11px] font-semibold uppercase tracking-wider text-red-300 block">
                                            Nilai Loss Sesi Ini ({stats.losses}x LOSS)
                                        </span>
                                        <span className="font-mono text-lg sm:text-xl font-extrabold text-red-400 mt-0.5 block">
                                            -{formatIDR(stats.grossLossValue)}
                                        </span>
                                        <span className="text-[11px] text-red-300/70">
                                            Akumulasi kekalahan kotor
                                        </span>
                                    </div>
                                    <div className="w-10 h-10 rounded-xl bg-red-500/20 border border-red-500/30 flex items-center justify-center text-red-400">
                                        <Icon name="trending-down" size={20} />
                                    </div>
                                </div>

                                {/* Kartu 4: Hasil Bersih (Net Profit / Loss Sesi) */}
                                <div className={`p-4 rounded-xl border flex items-center justify-between ${
                                    stats.netSessionProfit >= 0
                                        ? 'bg-gradient-to-br from-emerald-950/40 to-zinc-900 border-emerald-500/40'
                                        : 'bg-gradient-to-br from-red-950/40 to-zinc-900 border-red-500/40'
                                }`}>
                                    <div>
                                        <span className="text-[11px] font-semibold uppercase tracking-wider text-zinc-200 block">
                                            Net Profit / Loss Sesi Ini
                                        </span>
                                        <span className={`font-mono text-lg sm:text-xl font-extrabold mt-0.5 block ${
                                            stats.netSessionProfit >= 0 ? 'text-emerald-400' : 'text-red-400'
                                        }`}>
                                            {stats.netSessionProfit >= 0 ? '+' : ''}{formatIDR(stats.netSessionProfit)}
                                        </span>
                                        <span className="text-[11px] text-zinc-300">
                                            Pertumbuhan Sesi: <strong>{stats.roiPercent >= 0 ? `+${stats.roiPercent}%` : `${stats.roiPercent}%`}</strong>
                                        </span>
                                    </div>
                                    <div className={`w-10 h-10 rounded-xl flex items-center justify-center font-bold ${
                                        stats.netSessionProfit >= 0 ? 'bg-emerald-500 text-zinc-950' : 'bg-red-600 text-white'
                                    }`}>
                                        <Icon name={stats.netSessionProfit >= 0 ? 'award' : 'alert-triangle'} size={20} />
                                    </div>
                                </div>
                            </div>

                            {/* Tabel Responsif */}
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="border-b border-white/10 text-[11px] font-bold uppercase tracking-wider text-zinc-400 bg-zinc-950/60">
                                            <th className="py-3 px-4 rounded-tl-xl">Waktu & Speed Shot</th>
                                            <th className="py-3 px-4">Metode Strategi</th>
                                            <th className="py-3 px-4">Aksi (OP)</th>
                                            <th className="py-3 px-4">Nilai Profit / Loss</th>
                                            <th className="py-3 px-4">Nominal OP</th>
                                            <th className="py-3 px-4 text-right rounded-tr-xl">Saldo Akhir & Net Sesi</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-white/5 text-xs">
                                        {tradeLogs.length === 0 ? (
                                            <tr>
                                                <td colSpan="6" className="py-10 text-center text-zinc-500">
                                                    Belum ada aktivitas trading pada sesi ini. Klik tombol <strong>Simulasi Candle NAIK / TURUN</strong> atau aktifkan <strong>START BOT</strong>.
                                                </td>
                                            </tr>
                                        ) : (
                                            tradeLogs.map((log) => (
                                                <tr key={log.id} className="hover:bg-white/[0.02] transition-colors">
                                                    <td className="py-3 px-4 font-mono text-zinc-300 whitespace-nowrap">
                                                        <div className="flex items-center gap-2">
                                                            <span>{log.time}</span>
                                                            <span className="px-1.5 py-0.5 text-[10px] rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                                                                ⚡ {log.latencyMs || 5}ms
                                                            </span>
                                                        </div>
                                                        <span className="text-[10px] text-zinc-500">{log.id}</span>
                                                    </td>
                                                    <td className="py-3 px-4 font-medium text-white whitespace-nowrap">
                                                        {log.method}
                                                        {log.step > 0 && (
                                                            <span className="ml-2 px-1.5 py-0.5 text-[10px] font-mono rounded bg-amber-500/20 text-amber-300 border border-amber-500/30">
                                                                Kompensasi K{log.step}
                                                            </span>
                                                        )}
                                                    </td>
                                                    <td className="py-3 px-4 whitespace-nowrap">
                                                        <span className={`inline-flex items-center gap-1 px-2.5 py-1 rounded-lg font-bold text-[11px] ${
                                                            log.action === 'UP'
                                                                ? 'bg-emerald-500/15 text-emerald-400 border border-emerald-500/30'
                                                                : 'bg-red-500/15 text-red-400 border border-red-500/30'
                                                        }`}>
                                                            <Icon name={log.action === 'UP' ? 'arrow-up-right' : 'arrow-down-right'} size={13} />
                                                            {log.action === 'UP' ? 'OP NAIK (CALL)' : 'OP TURUN (PUT)'}
                                                        </span>
                                                    </td>
                                                    <td className="py-3 px-4 whitespace-nowrap font-mono">
                                                        <span className={`inline-flex items-center gap-1 px-2.5 py-1 rounded-lg font-extrabold text-[11px] ${
                                                            log.status === 'WIN'
                                                                ? 'bg-emerald-500 text-zinc-950'
                                                                : 'bg-red-600 text-white'
                                                        }`}>
                                                            {log.status}: {log.profitChange >= 0 ? `+${formatIDR(log.profitChange)}` : formatIDR(log.profitChange)}
                                                        </span>
                                                    </td>
                                                    <td className="py-3 px-4 font-mono font-semibold text-zinc-200 whitespace-nowrap">
                                                        {formatIDR(log.amount)}
                                                    </td>
                                                    <td className="py-3 px-4 font-mono font-bold text-right whitespace-nowrap">
                                                        <span className="text-white block">
                                                            {formatIDR(log.balanceAfter || (initialBalance + log.totalProfit))}
                                                        </span>
                                                        <span className={`text-[10px] font-semibold ${log.totalProfit >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>
                                                            Net Sesi: {log.totalProfit >= 0 ? '+' : ''}{formatIDR(log.totalProfit)}
                                                        </span>
                                                    </td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
