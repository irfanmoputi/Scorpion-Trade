    <!-- Tailwind CSS CDN -->

        tailwind.config = {

                extend: {

                        mono: ['JetBrains Mono', 'monospace'],

    <!-- React & ReactDOM CDN -->

    <style>
        body {
            background-color: #050507;
            color: #F4F4F6;
            overflow-x: hidden;
        }
        /* Custom Black & Gold Glossy Luxury Effects */
        .bg-glossy-dark {
            background: radial-gradient(circle at top right, rgba(234, 179, 8, 0.08), transparent 55%),
                        linear-gradient(145deg, rgba(20, 18, 12, 0.96) 0%, rgba(7, 7, 10, 0.99) 100%);
            backdrop-filter: blur(16px);
        }
        .border-glossy {
            border: 1px solid rgba(234, 179, 8, 0.32);
            box-shadow: inset 0 1px 0 0 rgba(254, 240, 138, 0.25), 0 12px 35px -10px rgba(0, 0, 0, 0.92), 0 0 25px -8px rgba(234, 179, 8, 0.15);
        }
        .matte-crimson {
            background: linear-gradient(135deg, #FFFBEB 0%, #FDE047 35%, #D4AF37 70%, #854D0E 100%);
            border: 1px solid rgba(254, 249, 195, 0.75);
            color: #050507 !important;
            box-shadow: 0 0 22px rgba(234, 179, 8, 0.4), inset 0 1px 2px rgba(255, 255, 255, 0.8);
        }
        .glossy-white-accent {
            background: linear-gradient(180deg, #FFFBEB 0%, #FDE047 38%, #CA8A04 82%, #713F12 100%);
            color: #050507 !important;
            border: 1px solid rgba(254, 249, 195, 0.8);
            box-shadow: 0 0 25px rgba(234, 179, 8, 0.45), inset 0 1px 2px rgba(255, 255, 255, 0.85);
        }
        .text-gold-glossy {
            background: linear-gradient(180deg, #FFFFFF 0%, #FEF08A 30%, #EAB308 65%, #A16207 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 12px rgba(234, 179, 8, 0.35));
        }
        .gold-shimmer-card {
            background: radial-gradient(circle at top right, rgba(234, 179, 8, 0.14), transparent 60%),
                        linear-gradient(145deg, #12100B 0%, #060608 100%);
            border: 1px solid rgba(250, 204, 21, 0.35);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.9), inset 0 1px 0 0 rgba(254, 249, 195, 0.25);

        ::-webkit-scrollbar {
            width: 6px;

        .animate-pulse-fast {
            animation: pulse-fast 1.2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="min-h-screen antialiased selection:bg-amber-500 selection:text-black">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // Komponen Logo 3D Metallic Golden Scorpion dengan Bingkai Cincin Ganda
        const GoldenScorpionLogo = ({ size = 56 }) => (

                    </linearGradient>
                    <linearGradient id="scorpionGold3D" x1="15%" y1="10%" x2="85%" y2="90%">
                        <stop offset="0%" stopColor="#FFFFFF" />

                        <stop offset="45%" stopColor="#EAB308" />

                    <radialGradient id="goldSpecular" cx="35%" cy="30%" r="65%">

                        <stop offset="0%" stopColor="#EAB308" />

                </defs>

                <circle cx="100" cy="100" r="93" fill="#FFFFFF" />
                <ellipse cx="98" cy="142" rx="58" ry="14" fill="url(#floorShadow)" />

                <circle cx="100" cy="100" r="91" fill="none" stroke="url(#outerGoldRing)" strokeWidth="9.5" />
                <circle cx="100" cy="100" r="95.5" fill="none" stroke="#713F12" strokeWidth="0.8" opacity="0.7" />
                <circle cx="100" cy="100" r="77.5" fill="none" stroke="url(#innerGoldRing)" strokeWidth="4.2" />

                <g stroke="#5C3409" strokeWidth="0.8" strokeLinejoin="round">
                    <path d="M84 108 L75 98 L65 113 L61 117 L66 118 L75 104 L84 111 Z" fill="url(#darkGoldShade)" />
                    <path d="M95 103 L87 91 L76 107 L72 111 L77 112 L87 97 L95 106 Z" fill="url(#darkGoldShade)" />
                    <path d="M107 98 L99 87 L89 102 L86 106 L91 106 L99 93 L107 101 Z" fill="url(#darkGoldShade)" />
                </g>

                <g stroke="#5C3409" strokeWidth="1" strokeLinejoin="round">
                    <path d="M84 116 C75 109, 66 106, 59 111 C55 114, 59 121, 67 121 C73 121, 79 121, 84 119 Z" fill="url(#goldSpecular)" />
                    <path d="M61 111 C49 109, 40 116, 36 128 C34 134, 34 139, 36 140 C39 138, 43 131, 47 127 C51 124, 57 123, 62 119 Z" fill="url(#goldSpecular)" />

                </g>

                <g stroke="#5C3409" strokeWidth="1.1" strokeLinejoin="round">
                    <path d="M132 103 C143 102, 152 94, 151 84 C149 77, 139 78, 134 85 C130 91, 129 98, 132 103 Z" fill="url(#goldSpecular)" />
                    <path d="M140 84 C152 83, 159 73, 156 63 C153 56, 142 58, 139 66 C136 73, 137 80, 140 84 Z" fill="url(#goldSpecular)" />
                    <path d="M143 64 C154 60, 158 49, 151 41 C145 35, 135 40, 136 49 C136 56, 139 61, 143 64 Z" fill="url(#goldSpecular)" />
                    <path d="M142 44 C147 36, 141 28, 130 31 C122 33, 118 41, 122 47 C127 51, 136 49, 142 44 Z" fill="url(#goldSpecular)" />
                    <path d="M124 41 C116 42, 112 51, 117 59 C121 65, 130 65, 132 58 C134 52, 130 43, 124 41 Z" fill="url(#goldSpecular)" />
                    <path d="M128 60 C132 65, 133 72, 129 78 C128 73, 127 67, 123 62 Z" fill="url(#darkGoldShade)" />
                </g>

                <g stroke="#5C3409" strokeWidth="1.1" strokeLinejoin="round">
                    <path d="M122 95 C132 92, 142 99, 141 108 C139 115, 129 117, 120 112 Z" fill="url(#goldSpecular)" />
                    <path d="M114 97 C125 93, 136 101, 135 112 C133 119, 122 121, 112 115 Z" fill="url(#goldSpecular)" />
                    <path d="M106 100 C118 96, 130 105, 128 116 C125 123, 114 125, 104 118 Z" fill="url(#goldSpecular)" />
                    <path d="M98 104 C110 99, 123 108, 121 120 C118 127, 106 129, 96 122 Z" fill="url(#goldSpecular)" />
                    <path d="M90 108 C102 103, 115 112, 113 124 C110 131, 98 133, 88 126 Z" fill="url(#goldSpecular)" />
                    <path d="M78 116 C86 107, 102 108, 106 119 C109 128, 97 136, 84 133 C76 131, 74 122, 78 116 Z" fill="url(#goldSpecular)" />
                    <ellipse cx="88" cy="117" rx="3.5" ry="2" transform="rotate(-18 88 117)" fill="#713F12" opacity="0.65" />
                </g>

                <g stroke="#5C3409" strokeWidth="1" strokeLinejoin="round">
                    <path d="M102 128 L115 123 L123 139 L121 148 L125 149 L127 138 L117 119 L101 124 Z" fill="url(#scorpionGold3D)" />
                    <path d="M111 124 L128 118 L139 135 L142 145 L147 146 L143 133 L130 114 L110 120 Z" fill="url(#scorpionGold3D)" />
                    <path d="M120 119 L139 112 L153 129 L158 139 L164 139 L157 126 L141 107 L119 115 Z" fill="url(#scorpionGold3D)" />
                </g>

                <g stroke="#451A03" strokeWidth="1.2" strokeLinejoin="round">
                    <path d="M94 128 C102 128, 111 133, 112 141 C112 148, 104 152, 97 148 C92 145, 91 135, 94 128 Z" fill="url(#goldSpecular)" />
                    <path d="M106 138 C100 132, 88 134, 78 142 C72 146, 65 148, 66 150 C68 152, 76 151, 83 149 C78 154, 70 158, 69 161 C71 163, 81 160, 90 155 C101 150, 109 145, 106 138 Z" fill="url(#goldSpecular)" />
                    <path d="M84 143 C90 139, 97 138, 101 141" stroke="#FFFBEB" strokeWidth="2.2" strokeLinecap="round" opacity="0.85" />
                    <path d="M93 114 C103 108, 116 102, 128 97" stroke="#FFFBEB" strokeWidth="2" strokeLinecap="round" opacity="0.7" />
                </g>
            </svg>
        );

        // Komponen Helper Ikon Lucide
        const Icon = ({ name, size = 18, className = "" }) => {
            const spanRef = useRef(null);
            useEffect(() => {
                if (spanRef.current && window.lucide) {
                    spanRef.current.innerHTML = `<i data-lucide="${name}"></i>`;
                    window.lucide.createIcons({
                        root: spanRef.current,
                        attrs: { width: size, height: size, class: className }
                    });
                }
            }, [name, size, className]);
            return <span ref={spanRef} className="inline-flex items-center justify-center shrink-0" />;
        };

        // Komponen Tooltip Penjelas
        const InfoTooltip = ({ text }) => (
            <div className="relative group inline-flex items-center ml-1.5 cursor-help align-middle">
                <span className="w-4 h-4 rounded-full bg-zinc-900 border border-amber-500/50 text-amber-300 flex items-center justify-center text-[10px] font-bold group-hover:bg-amber-400 group-hover:border-amber-200 group-hover:text-black transition-colors">
                    ?
                </span>
                <div className="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 hidden group-hover:block w-64 p-2.5 bg-zinc-950/95 text-zinc-100 text-xs leading-relaxed rounded-xl border border-amber-500/40 shadow-2xl z-50 pointer-events-none backdrop-blur-md">
                    {text}
                    <div className="absolute top-full left-1/2 -translate-x-1/2 border-4 border-transparent border-t-amber-500/40"></div>
                </div>
            </div>
        );

        // Format Rupiah
        const formatIDR = (number) => {
            const prefix = number < 0 ? "-Rp " : "Rp ";
            return prefix + Math.abs(Math.round(number)).toLocaleString('id-ID');
        };

        // Daftar Metode Trading
        const STRATEGIES = {
            anti_sideway: {
                id: 'anti_sideway',
                name: 'Metode 1: Anti-Sideway (Follow Action)',
                shortName: 'Anti-Sideway',
                badge: 'Adaptif Arah Market',
                desc: 'Bot beradaptasi mengikuti arah aktual terakhir. Jika OP Naik dan hasilnya Naik, OP selanjutnya Naik. Jika OP Naik tapi hasilnya Turun, OP selanjutnya berbalik menjadi Turun.',
            },
            follow_trend: {
                id: 'follow_trend',
                name: 'Metode 2: Trend Panjang (Follow Trend)',
                shortName: 'Follow Trend',
                badge: 'Cocok Pasar Bullish/Bearish Kuat',
                desc: 'Bot selalu membuka posisi MENGIKUTI warna candle terakhir yang baru saja tertutup. Jika candle terakhir Hijau (Naik), maka bot otomatis OP NAIK (CALL). Jika Merah (Turun), bot otomatis OP TURUN (PUT).',
            },
            wave_2x2: {
                id: 'wave_2x2',
                name: 'Metode 3: Siklus Wave 2x2',
                shortName: 'Wave 2x2',
                badge: 'Pola Akurasi Rotasi',
                desc: 'Bot secara presisi dan disiplin mengeksekusi pola rotasi beruntun: 2x NAIK lalu 2x TURUN secara berulang (Siklus Wave). Sangat cocok untuk menangkap riak pergerakan market.',
            }
        };

        const App = () => {
            // ================= STATE UTAMA BOT =================
            const [botStatus, setBotStatus] = useState('STANDBY'); // 'STANDBY' | 'RUNNING' | 'PAUSED'
            const [toastMsg, setToastMsg] = useState(null);

            // ================= STATE PANEL KIRI: STRATEGI & KEUANGAN =================
            const [selectedMethod, setSelectedMethod] = useState('anti_sideway');
            const [baseAmount, setBaseAmount] = useState(14000);
            const [payoutRate, setPayoutRate] = useState(85);
            const [martingaleEnabled, setMartingaleEnabled] = useState(true);
            const [martingaleMultiplier, setMartingaleMultiplier] = useState(2.0);
            const [maxMartingaleStep, setMaxMartingaleStep] = useState(3);
            const [takeProfit, setTakeProfit] = useState(150000);
            const [stopLoss, setStopLoss] = useState(100000);

            // ================= STATE PANEL TENGAH: TIMING & SIMULATOR =================
            const [secondsLeft, setSecondsLeft] = useState(60);
            const [msLeft, setMsLeft] = useState(0);
            const [candleHistory, setCandleHistory] = useState([]);
            const [currentStep, setCurrentStep] = useState(0);
            const [pingPongSignal, setPingPongSignal] = useState('UP');
            const [waveIndex, setWaveIndex] = useState(0);
            const [cumulativeProfit, setCumulativeProfit] = useState(0);
            const [initialBalance, setInitialBalance] = useState(1000000);
            const [liveBrokerBalance, setLiveBrokerBalance] = useState(null);
            const [lastBalanceSync, setLastBalanceSync] = useState(null);
            const [accountType, setAccountType] = useState('REAL');

            // State Zero-Delay Auto-Shot Engine
            const [zeroDelayShot, setZeroDelayShot] = useState(true);
            const [preShotLeadMs, setPreShotLeadMs] = useState(150);

            // ================= STATE PANEL KANAN: BRIDGE & SELECTOR =================
            const [brokerPreset, setBrokerPreset] = useState('stockity');
            const [callSelector, setCallSelector] = useState('.deal-button--up, .deal-buttons__button_up, .btn-call, [data-test="deal-button-up"], [data-test="control-call"], button.bg-green, .vui-button--green');
            const [putSelector, setPutSelector] = useState('.deal-button--down, .deal-buttons__button_down, .btn-put, [data-test="deal-button-down"], [data-test="control-put"], button.bg-red, .vui-button--red');
            const [amountSelector, setAmountSelector] = useState('input[name="amount"], .amount-input input');
            const [balanceSelector, setBalanceSelector] = useState('.header-balance__sum, .header__balance-amount, .balance_current, [data-test="balance-amount"], .account-balance__amount, .balance-text');
            const [activeRightTab, setActiveRightTab] = useState('script');
            const [copiedScript, setCopiedScript] = useState(false);

            // ================= FOOTER LOGS (BERSIH / REAL TRADING) =================
            const [tradeLogs, setTradeLogs] = useState([]);

            // Notifikasi Toast
            const showNotification = (title, message, type = 'info') => {
                setToastMsg({ title, message, type });
                setTimeout(() => {
                    setToastMsg((prev) => (prev?.title === title ? null : prev));
                }, 4000);
            };

            // Preset Broker
            const handleBrokerPresetChange = (preset) => {
                setBrokerPreset(preset);
                if (preset === 'stockity') {
                    setCallSelector('.deal-button--up, .deal-buttons__button_up, .btn-call, [data-test="deal-button-up"], [data-test="control-call"]');
                    setPutSelector('.deal-button--down, .deal-buttons__button_down, .btn-put, [data-test="deal-button-down"], [data-test="control-put"]');
                    setBalanceSelector('.header-balance__sum, .header__balance-amount, .balance_current, [data-test="balance-amount"], .account-balance__amount, .balance-text');
                } else if (preset === 'binomo') {
                    setCallSelector('.call-btn, vui-button.btn-up, [data-qa="call-button"]');
                    setPutSelector('.put-btn, vui-button.btn-down, [data-qa="put-button"]');
                    setBalanceSelector('.balance-info__sum, [data-qa="header-balance-amount"], .user-balance__amount');
                }
                showNotification('Preset Diubah', `Selector tombol & pembaca saldo disesuaikan untuk ${preset.toUpperCase()}.`, 'info');
            };

            // ================= LISTENER PEMBACA SALDO LIVE & PERUBAHAN METODE DARI HUD =================
            useEffect(() => {
                const handleIncomingData = (data) => {
                    if (!data) return;
                    if (data.source === 'BROKER_DOM_READER_V1' && typeof data.balance === 'number' && !isNaN(data.balance)) {
                        setLiveBrokerBalance(data.balance);
                        setLastBalanceSync(data.time || new Date().toLocaleTimeString('id-ID', { hour12: false }));
                        if (data.accountMode === 'REAL' || data.accountMode === 'DEMO') {
                            setAccountType(data.accountMode);
                        }
                        if (data.isInitialSync) {
                            setInitialBalance(data.balance - cumulativeProfit);
                        }
                    }
                    if (data.source === 'BROKER_HUD_V1' && data.type === 'CHANGE_STRATEGY' && STRATEGIES[data.method]) {
                        setSelectedMethod(data.method);
                        setCurrentStep(0);
                        setWaveIndex(0);
                    }
                };

                let bc;
                try {
                    bc = new BroadcastChannel('bot_trading_engine_v1_channel');
                    bc.onmessage = (event) => handleIncomingData(event.data);
                } catch (e) {}

                const handleStorage = (e) => {
                    if (e.key === 'BOT_TRADING_LIVE_BALANCE' && e.newValue) {
                        try {
                            handleIncomingData(JSON.parse(e.newValue));
                        } catch (err) {}
                    }
                };
                window.addEventListener('storage', handleStorage);

                return () => {
                    if (bc) bc.close();
                    window.removeEventListener('storage', handleStorage);
                };
            }, [cumulativeProfit]);

            // ================= KALKULASI NOMINAL OP & MARTINGALE =================
            const currentTradeAmount = useMemo(() => {
                if (!martingaleEnabled || currentStep === 0) return Number(baseAmount) || 14000;
                return Math.round((Number(baseAmount) || 14000) * Math.pow(Number(martingaleMultiplier) || 2, currentStep));
            }, [baseAmount, martingaleEnabled, martingaleMultiplier, currentStep]);

            const martingalePreview = useMemo(() => {
                const steps = [];
                const limit = martingaleEnabled ? Number(maxMartingaleStep) : 0;
                for (let i = 0; i <= limit; i++) {
                    steps.push({
                        step: i,
                        amount: Math.round((Number(baseAmount) || 14000) * Math.pow(Number(martingaleMultiplier) || 2, i))
                    });
                }
                return steps;
            }, [baseAmount, martingaleEnabled, martingaleMultiplier, maxMartingaleStep]);

            // ================= LOGIKA PREDIKSI SINYAL BERIKUTNYA =================
            const nextSignalData = useMemo(() => {
                if (selectedMethod === 'anti_sideway') {
                    return {
                        signal: pingPongSignal,
                        reason: candleHistory.length === 0
                            ? 'Menunggu candle pertama (Arah awal adaptif: NAIK)'
                            : `Adaptif mengikuti arah aktual terakhir (${pingPongSignal === 'UP' ? 'NAIK' : 'TURUN'})`
                    };
                }
                if (selectedMethod === 'follow_trend') {
                    const lastCandle = candleHistory[candleHistory.length - 1] || 'UP';
                    return {
                        signal: lastCandle,
                        reason: candleHistory.length === 0
                            ? 'Default awal mengikuti arah NAIK hingga candle terbentuk'
                            : `Mengikuti arah candle terakhir (${lastCandle === 'UP' ? 'Hijau/Naik' : 'Merah/Turun'})`
                    };
                }
                if (selectedMethod === 'wave_2x2') {
                    const pattern = ['UP', 'UP', 'DOWN', 'DOWN'];
                    const sig = pattern[waveIndex % 4];
                    return {
                        signal: sig,
                        reason: `Siklus Wave 2x2 langkah ke-${(waveIndex % 4) + 1} dari 4 (${sig === 'UP' ? '2x NAIK' : '2x TURUN'})`
                    };
                }
                return { signal: 'UP', reason: 'Siap menembak sinyal' };
            }, [selectedMethod, pingPongSignal, candleHistory, waveIndex]);

            // ================= LIVE COUNTDOWN TIMER (REQUEST ANIMATION FRAME) =================
            useEffect(() => {
                let rafId;
                const updateClock = () => {
                    const now = Date.now();
                    const msRemaining = 60000 - (now % 60000);
                    setSecondsLeft(Math.floor(msRemaining / 1000) % 60);
                    setMsLeft(msRemaining % 1000);
                    rafId = requestAnimationFrame(updateClock);
                };
                rafId = requestAnimationFrame(updateClock);
                return () => cancelAnimationFrame(rafId);
            }, []);

            // ================= SIMULATOR MANUAL UNTUK UJI LOGIKA 3 METODE =================
            const handleSimulateCandle = (actualCandleDirection) => {
                const predictedSignal = nextSignalData.signal;
                const wager = currentTradeAmount;
                const isWin = predictedSignal === actualCandleDirection;
                const profitDelta = isWin ? Math.round(wager * (Number(payoutRate) / 100)) : -wager;
                const newCumulative = cumulativeProfit + profitDelta;

                // Update Riwayat Candle

    function syncWithBrokerServerClock() {
        const candidates = document.querySelectorAll('div, span, p');
        for (let i = 0; i < candidates.length; i++) {
            const el = candidates[i];
            if (el.children.length > 0) continue;
            if (el.closest && el.closest('#scorpions-king-floating-hud')) continue;

            const rect = el.getBoundingClientRect();
            if (rect.top < 40 || rect.top > 150 || rect.left > 320 || rect.width === 0) continue;

            const txt = (el.textContent || '').trim();
            // Wajib mengandung format HH:MM:SS diikuti GMT agar tidak salah membaca angka lain
            const match = txt.match(/(\\d{2}):(\\d{2}):(\\d{2})\\s*GMT/i);
            if (match) {
                const serverSec = parseInt(match[3], 10);
                if (!isNaN(serverSec) && serverSec >= 0 && serverSec <= 59) {
                    if (lastObservedServerSec !== -1 && serverSec !== lastObservedServerSec) {
                        const localMsInMin = Date.now() % 60000;
                        const serverMsInMin = serverSec * 1000;
                        let diff = serverMsInMin - localMsInMin;
                        if (diff > 30000) diff -= 60000;
                        if (diff < -30000) diff += 60000;
                        brokerTimeOffsetMs = diff;
                        isServerClockSynced = true;

                        const syncBadge = document.getElementById('sk-sync-badge');
                        if (syncBadge) {
                            syncBadge.innerText = "SYNC GMT";
                            syncBadge.style.color = "#22C55E";
                        }
                    }
                    lastObservedServerSec = serverSec;
                }
                break;
            }
        }
    }

        if (visibleBtn) return visibleBtn;

        const allElements = document.querySelectorAll('*');
        const rightHalf = window.innerWidth * 0.5;
        const bottomHalf = window.innerHeight * 0.35;

        for (let i = allElements.length - 1; i >= 0; i--) {
            const el = allElements[i];
            if (el.closest && el.closest('#scorpions-king-floating-hud')) continue;
            const rect = el.getBoundingClientRect();

            if (rect.left > rightHalf && rect.top > bottomHalf && rect.width > 20 && rect.height > 20) {
                const style = window.getComputedStyle(el);
                const bg = style.backgroundColor;
                const match = bg.match(/rgba?\\((\\d+),\\s*(\\d+),\\s*(\\d+)/);
                if (match) {
                    const r = parseInt(match[1], 10), g = parseInt(match[2], 10), b = parseInt(match[3], 10);
                    const isClickable = el.tagName === 'BUTTON' || style.cursor === 'pointer' || el.closest('button');
                    if (isClickable) {
                        if (direction === "UP") {
                            if (g > r + 30 && g > b + 30) return el.tagName === 'BUTTON' ? el : (el.closest('button') || el);

                                    </div>

                                    {/* Progress Bar Detik */}
                                    <div className="w-full h-2 bg-zinc-900 rounded-full overflow-hidden border border-amber-500/20 mb-4">
                                        <div
                                            className="h-full bg-gradient-to-r from-amber-600 via-yellow-400 to-emerald-400 transition-all duration-75"
                                            style={{ width: `${((60 - secondsLeft) / 60) * 100}%` }}
                                        ></div>
                                    </div>

                                    {/* Kompensasi Ping Pre-Trigger */}
                                    <div className="flex items-center justify-between gap-2 bg-zinc-950/90 border border-amber-500/25 rounded-xl px-3 py-2 text-xs">
                                        <span className="text-zinc-400 font-medium flex items-center">
                                            Kompensasi Ping
                                            <InfoTooltip text="Menembakkan klik lebih awal beberapa milidetik untuk mengimbangi kecepatan internet Anda." />
                                        </span>
                                        <div className="flex items-center gap-1">
                                            {[0, 150, 300].map((ms) => (
                                                <button
                                                    key={ms}
                                                    onClick={() => setPreShotLeadMs(ms)}
                                                    className={`px-2 py-1 rounded-lg font-mono text-[11px] font-bold transition ${
                                                        preShotLeadMs === ms
                                                            ? 'bg-amber-400 text-black'
                                                            : 'bg-zinc-900 text-zinc-400 hover:text-white'
                                                    }`}
                                                >
                                                    -{ms}ms
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                {/* Prediksi Sinyal Berikutnya */}
                                <div className="bg-zinc-950/90 border border-amber-500/30 rounded-2xl p-4 space-y-3">
                                    <div className="flex items-center justify-between">
                                        <span className="text-xs font-bold text-zinc-400 uppercase tracking-wider">Sinyal Berikutnya</span>
                                        <span className="text-xs font-mono font-bold text-amber-300">
                                            OP: {formatIDR(currentTradeAmount)} (Step {currentStep})
                                        </span>
                                    </div>
                                    <div className={`rounded-xl p-3.5 flex items-center justify-between border ${
                                        nextSignalData.signal === 'UP'
                                            ? 'bg-emerald-500/15 border-emerald-500/40 text-emerald-300'
                                            : 'bg-red-500/15 border-red-500/40 text-red-300'
                                    }`}>
                                        <div className="flex items-center gap-3">
                                            <div className={`w-10 h-10 rounded-xl flex items-center justify-center ${
                                                nextSignalData.signal === 'UP' ? 'bg-emerald-500 text-black' : 'bg-red-600 text-white'
                                            }`}>
                                                <Icon name={nextSignalData.signal === 'UP' ? 'trending-up' : 'trending-down'} size={22} />
                                            </div>
                                            <div>
                                                <div className="text-lg font-extrabold tracking-wide">
                                                    {nextSignalData.signal === 'UP' ? 'NAIK (CALL)' : 'TURUN (PUT)'}
                                                </div>
                                                <div className="text-[11px] opacity-85">{nextSignalData.reason}</div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Riwayat Mini Candlestick */}
                                    <div className="pt-1">
                                        <div className="flex items-center justify-between text-[11px] text-zinc-400 mb-2">
                                            <span>Riwayat Pergerakan Candle</span>
                                            <span>{candleHistory.length} Candle</span>
                                        </div>
                                        <div className="h-11 bg-zinc-900/80 rounded-xl border border-zinc-800 px-3 flex items-center gap-1.5 overflow-x-auto">
                                            {candleHistory.length === 0 ? (
                                                <span className="text-[11px] text-zinc-500 italic w-full text-center">
                                                    Belum ada data candle (Siap Real Trading / Uji Manual)
                                                </span>
                                            ) : (
                                                candleHistory.map((dir, idx) => (
                                                    <div
                                                        key={idx}
                                                        title={`Candle #${idx + 1}: ${dir === 'UP' ? 'NAIK' : 'TURUN'}`}
                                                        className={`w-3.5 shrink-0 rounded-sm ${
                                                            dir === 'UP' ? 'h-7 bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)]' : 'h-7 bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.5)]'
                                                        }`}
                                                    ></div>
                                                ))
                                            )}
                                        </div>
                                    </div>
                                </div>

                                {/* Panel Uji Manual Logika 3 Metode */}
                                <div className="space-y-2.5 mt-auto">
                                    <div className="text-xs font-bold text-amber-200 flex items-center">
                                        Simulasi Pergerakan Chart (Uji Logika)
                                        <InfoTooltip text="Klik tombol Hijau atau Merah untuk menguji apakah pola Metode 1, 2, 3 dan Martingale sudah sesuai sebelum live di broker." />
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <button
                                            onClick={() => handleSimulateCandle('UP')}
                                            className="py-3 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-black font-extrabold text-xs flex items-center justify-center gap-1.5 shadow-lg transition active:scale-95"
                                        >
                                            <Icon name="arrow-up-circle" size={16} />
                                            Candle NAIK (Hijau)
                                        </button>
                                        <button
                                            onClick={() => handleSimulateCandle('DOWN')}
                                            className="py-3 px-3 rounded-xl bg-red-600 hover:bg-red-500 text-white font-extrabold text-xs flex items-center justify-center gap-1.5 shadow-lg transition active:scale-95"
                                        >
                                            <Icon name="arrow-down-circle" size={16} />
                                            Candle TURUN (Merah)
                                        </button>
                                    </div>
                                </div>
                            </section>

                            {/* ==================== PANEL KANAN: EKSEKUSI & SCRIPT GENERATOR ==================== */}
                            <section className="lg:col-span-4 bg-glossy-dark border-glossy rounded-2xl p-5 flex flex-col gap-4">
                                <div className="flex items-center justify-between border-b border-amber-500/20 pb-3">
                                    <div className="flex items-center gap-2.5">
                                        <div className="w-8 h-8 rounded-xl bg-amber-500/15 border border-amber-500/40 text-amber-400 flex items-center justify-center">
                                            <Icon name="terminal" size={17} />
                                        </div>
                                        <div>
                                            <h2 className="text-sm font-bold text-amber-100 uppercase tracking-wider">Bridge & Auto-Clicker</h2>
                                            <p className="text-[11px] text-zinc-400">Hubungkan ke layar Stockity / Binomo</p>
                                        </div>
                                    </div>
                                </div>

                                {/* Preset Broker */}
                                <div className="grid grid-cols-2 gap-2">
                                    {['stockity', 'binomo'].map((broker) => (
                                        <button
                                            key={broker}
                                            onClick={() => handleBrokerPresetChange(broker)}
                                            className={`py-2 rounded-xl text-xs font-extrabold uppercase tracking-wider border transition ${
                                                brokerPreset === broker
                                                    ? 'bg-amber-400 text-black border-amber-200 shadow-[0_0_15px_rgba(250,204,21,0.35)]'
                                                    : 'bg-zinc-950 text-zinc-400 border-zinc-800 hover:border-amber-500/40'
                                            }`}
                                        >
                                            {broker}
                                        </button>
                                    ))}
                                </div>

                                {/* Tabs Panel Kanan */}
                                <div className="flex bg-zinc-950 p-1 rounded-xl border border-amber-500/20">
                                    {[
                                        { id: 'script', label: 'Script Otomatis', icon: 'code' },
                                        { id: 'guide', label: 'Panduan F12', icon: 'book-open' },
                                        { id: 'config', label: 'CSS Selector', icon: 'settings' }
                                    ].map((tab) => (
                                        <button
                                            key={tab.id}
                                            onClick={() => setActiveRightTab(tab.id)}
                                            className={`flex-1 py-1.5 rounded-lg text-[11px] font-bold flex items-center justify-center gap-1.5 transition ${
                                                activeRightTab === tab.id
                                                    ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40'
                                                    : 'text-zinc-400 hover:text-zinc-200'
                                            }`}
                                        >
                                            <Icon name={tab.icon} size={13} />
                                            {tab.label}
                                        </button>
                                    ))}
                                </div>

                                {/* Isi Tab: Script Otomatis */}
                                {activeRightTab === 'script' && (
                                    <div className="flex-1 flex flex-col gap-3">
                                        <div className="bg-amber-500/10 border border-amber-500/30 rounded-xl p-3 text-[11px] text-amber-100 leading-relaxed">
                                            <strong className="text-amber-300">✨ Fitur Baru v2.0:</strong> Auto-Sync jam server Stockity (<span className="font-mono">GMT</span>), Dropdown Pilih Metode langsung di layar broker, dan Pembaca Saldo Real Akun.
                                        </div>

                                        <button
                                            onClick={handleCopyScript}
                                            className="w-full py-3 rounded-xl glossy-white-accent font-extrabold text-xs tracking-wider flex items-center justify-center gap-2 transition active:scale-95"
                                        >
                                            <Icon name={copiedScript ? 'check' : 'copy'} size={16} />
                                            {copiedScript ? 'BERHASIL DISALIN! PASTE DI CONSOLE (F12)' : 'ONE-CLICK COPY SCRIPT OTOMATIS'}
                                        </button>

                                        <div className="relative flex-1 min-h-[220px]">
                                            <pre className="absolute inset-0 bg-zinc-950 border border-amber-500/25 rounded-xl p-3 text-[11px] font-mono text-amber-200/90 overflow-auto leading-relaxed">
                                                <code>{generatedBridgeScript}</code>
                                            </pre>
                                        </div>
                                    </div>
                                )}

                                {/* Isi Tab: Panduan Step-by-Step */}
                                {activeRightTab === 'guide' && (
                                    <div className="flex-1 overflow-y-auto space-y-2.5 text-xs text-zinc-300 pr-1">
                                        <div className="bg-zinc-950/90 border border-amber-500/25 rounded-xl p-3">
                                            <div className="font-bold text-amber-300 mb-1">1. Salin Script Otomatis</div>
                                            <p className="text-[11px] text-zinc-400">Klik tombol emas <strong>ONE-CLICK COPY SCRIPT OTOMATIS</strong> di tab Script Otomatis.</p>
                                        </div>
                                        <div className="bg-zinc-950/90 border border-amber-500/25 rounded-xl p-3">
                                            <div className="font-bold text-amber-300 mb-1">2. Buka Stockity / Binomo & Tekan F12</div>
                                            <p className="text-[11px] text-zinc-400">Buka tab trading Anda, pastikan timeframe chart <strong>1m</strong>, lalu tekan <strong>F12</strong> dan pilih tab <strong>Console</strong>.</p>
                                        </div>
                                        <div className="bg-zinc-950/90 border border-amber-500/25 rounded-xl p-3">
                                            <div className="font-bold text-amber-300 mb-1">3. Paste di Sebelah Tanda Panah &gt;</div>
                                            <p className="text-[11px] text-zinc-400">Klik ikon bersihkan (🚫), lalu klik kanan di sebelah tanda <code>&gt;</code>. Jika Chrome memblokir paste, ketik <code>allow pasting</code> lalu Enter, kemudian tekan <strong>Ctrl + V</strong> dan <strong>Enter</strong>.</p>
                                        </div>
                                        <div className="bg-zinc-950/90 border border-amber-500/25 rounded-xl p-3">
                                            <div className="font-bold text-amber-300 mb-1">4. Panel Melayang & Auto-Sync GMT</div>
                                            <p className="text-[11px] text-zinc-400">Panel <strong>SCORPIONS KING</strong> akan muncul di pojok kanan atas chart. Tunggu 1-2 detik hingga status berubah menjadi <strong>SYNC GMT</strong>, lalu aktifkan <strong>AUTO-SHOT</strong>.</p>
                                        </div>
                                    </div>
                                )}

                                {/* Isi Tab: Custom CSS Selector */}
                                {activeRightTab === 'config' && (
                                    <div className="space-y-3 text-xs">
                                        <div>
                                            <label className="text-zinc-300 font-semibold block mb-1">Selector Tombol NAIK (CALL)</label>
                                            <input
                                                type="text"
                                                value={callSelector}
                                                onChange={(e) => setCallSelector(e.target.value)}
                                                className="w-full bg-zinc-950 border border-amber-500/30 rounded-xl px-3 py-2 font-mono text-[11px] text-emerald-300 focus:outline-none"
                                            />
                                        </div>
                                        <div>
                                            <label className="text-zinc-300 font-semibold block mb-1">Selector Tombol TURUN (PUT)</label>
                                            <input
                                                type="text"
                                                value={putSelector}
                                                onChange={(e) => setPutSelector(e.target.value)}
                                                className="w-full bg-zinc-950 border border-amber-500/30 rounded-xl px-3 py-2 font-mono text-[11px] text-red-300 focus:outline-none"
                                            />
                                        </div>
                                        <div>
                                            <label className="text-zinc-300 font-semibold block mb-1">Selector Pembaca Saldo Akun</label>
                                            <input
                                                type="text"
                                                value={balanceSelector}
                                                onChange={(e) => setBalanceSelector(e.target.value)}
                                                className="w-full bg-zinc-950 border border-amber-500/30 rounded-xl px-3 py-2 font-mono text-[11px] text-amber-300 focus:outline-none"
                                            />
                                        </div>
                                    </div>
                                )}
                            </section>
                        </div>

                        {/* ================= 5. BAGIAN BAWAH: METRIK SESI & TABEL LOG REAL-TIME ================= */}
                        <section className="bg-glossy-dark border-glossy rounded-2xl p-5 space-y-4">
                            {/* 4 Kartu Rekap Nilai Profit / Loss Sesi */}
                            <div className="grid grid-cols-2 lg:grid-cols-4 gap-3.5">
                                <div className="bg-zinc-950/90 border border-emerald-500/30 rounded-xl p-3.5">
                                    <span className="text-[11px] text-zinc-400 font-semibold uppercase">Nilai Profit Sesi (Gross)</span>
                                    <div className="text-lg sm:text-xl font-mono font-extrabold text-emerald-400 mt-1">
                                        +{formatIDR(sessionStats.grossProfit)}
                                    </div>
                                    <span className="text-[10px] text-emerald-300/70">{sessionStats.wins} Transaksi WIN</span>
                                </div>
                                <div className="bg-zinc-950/90 border border-red-500/30 rounded-xl p-3.5">
                                    <span className="text-[11px] text-zinc-400 font-semibold uppercase">Nilai Loss Sesi (Gross)</span>
                                    <div className="text-lg sm:text-xl font-mono font-extrabold text-red-400 mt-1">
                                        -{formatIDR(sessionStats.grossLoss)}
                                    </div>
                                    <span className="text-[10px] text-red-300/70">{sessionStats.losses} Transaksi LOSS</span>
                                </div>
                                <div className="bg-zinc-950/90 border border-amber-500/35 rounded-xl p-3.5">
                                    <span className="text-[11px] text-zinc-400 font-semibold uppercase">Net Profit / Loss Sesi</span>
                                    <div className={`text-lg sm:text-xl font-mono font-extrabold mt-1 ${cumulativeProfit >= 0 ? 'text-amber-300' : 'text-red-400'}`}>
                                        {cumulativeProfit > 0 ? '+' : ''}{formatIDR(cumulativeProfit)}
                                    </div>
                                    <span className="text-[10px] text-amber-200/70">ROI Sesi: {sessionStats.roi}%</span>
                                </div>
                                <div className="bg-zinc-950/90 border border-amber-500/35 rounded-xl p-3.5">
                                    <span className="text-[11px] text-zinc-400 font-semibold uppercase">Saldo Akhir ({accountType})</span>
                                    <div className="text-lg sm:text-xl font-mono font-extrabold text-white mt-1">
                                        {formatIDR(sessionStats.activeBalance)}
                                    </div>
                                    <span className="text-[10px] text-zinc-400">Win Rate: {sessionStats.winRate}%</span>
                                </div>
                            </div>

                            {/* Header Tabel Log */}
                            <div className="flex flex-wrap items-center justify-between gap-3 pt-2 border-t border-amber-500/20">
                                <div className="flex items-center gap-2">
                                    <Icon name="list" size={18} className="text-amber-400" />
                                    <h3 className="text-sm font-bold text-amber-100 uppercase tracking-wider">
                                        Log Aktivitas & Riwayat Trading Real-Time
                                    </h3>
                                </div>
                                <div className="flex items-center gap-2">
                                    <button
                                        onClick={handleResetLogs}
                                        className="px-3.5 py-2 rounded-xl bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 text-xs font-bold text-zinc-300 flex items-center gap-1.5 transition"
                                    >
                                        <Icon name="trash-2" size={14} />
                                        Reset Log
                                    </button>
                                    <button
                                        onClick={handleExportCSV}
                                        className="px-3.5 py-2 rounded-xl bg-amber-500/20 hover:bg-amber-500/30 border border-amber-500/40 text-xs font-bold text-amber-300 flex items-center gap-1.5 transition"
                                    >
                                        <Icon name="download" size={14} />
                                        Export Laporan
                                    </button>
                                </div>
                            </div>

                            {/* Tabel Log */}
                            <div className="overflow-x-auto rounded-xl border border-amber-500/20">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="bg-zinc-950 text-[11px] uppercase tracking-wider text-amber-300/80 border-b border-amber-500/20">
                                            <th className="py-3 px-4">Waktu</th>
                                            <th className="py-3 px-4">Metode</th>
                                            <th className="py-3 px-4">Aksi (OP)</th>
                                            <th className="py-3 px-4">Hasil</th>
                                            <th className="py-3 px-4 text-right">Nominal OP</th>
                                            <th className="py-3 px-4 text-right">Profit / Loss</th>
                                            <th className="py-3 px-4 text-right">Profit Kumulatif</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-zinc-800/70 text-xs font-mono">
                                        {tradeLogs.length === 0 ? (
                                            <tr>
                                                <td colSpan="7" className="py-10 text-center text-zinc-500 font-sans">
                                                    Belum ada riwayat transaksi pada sesi ini. Hubungkan Bridge ke Stockity/Binomo atau gunakan tombol Simulasi untuk menguji strategi.
                                                </td>
                                            </tr>
                                        ) : (
                                            tradeLogs.map((log) => (
                                                <tr key={log.id} className="hover:bg-amber-500/5 transition-colors">
                                                    <td className="py-3 px-4 text-zinc-300">{log.time}</td>
                                                    <td className="py-3 px-4 font-sans font-semibold text-zinc-200">{log.method}</td>
                                                    <td className="py-3 px-4">
                                                        <span className={`px-2 py-0.5 rounded-md font-bold ${
                                                            log.action === 'UP' ? 'bg-emerald-500/15 text-emerald-400' : 'bg-red-500/15 text-red-400'
                                                        }`}>
                                                            {log.action === 'UP' ? '▲ NAIK (CALL)' : '▼ TURUN (PUT)'}
                                                        </span>
                                                    </td>
                                                    <td className="py-3 px-4">
                                                        <span className={`px-2 py-0.5 rounded-md font-extrabold ${
                                                            log.result === 'WIN' ? 'bg-emerald-500 text-black' : 'bg-red-600 text-white'
                                                        }`}>
                                                            {log.result}
                                                        </span>
                                                    </td>
                                                    <td className="py-3 px-4 text-right text-zinc-200">{formatIDR(log.amount)}</td>
                                                    <td className={`py-3 px-4 text-right font-bold ${log.profitDelta >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>
                                                        {log.profitDelta > 0 ? '+' : ''}{formatIDR(log.profitDelta)}
                                                    </td>
                                                    <td className={`py-3 px-4 text-right font-bold ${log.cumulative >= 0 ? 'text-amber-300' : 'text-red-400'}`}>
                                                        {log.cumulative > 0 ? '+' : ''}{formatIDR(log.cumulative)}
                                                    </td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </section>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
